<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | ABCD Smart Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    // Immediate early theme detection to prevent flash of wrong theme
    (function() {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'dark-theme' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark-theme');
        } else {
          document.documentElement.classList.remove('dark-theme');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --bg: radial-gradient(circle at 50% 15%, #e0e7ff 0%, #f8fafc 70%, #f1f5f9 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(99, 102, 241, 0.16);
      --card-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.18), 0 10px 25px -5px rgba(0, 0, 0, 0.04);
      --text-title: #0f172a;
      --text-muted: #475569;
      --btn-sec-bg: #f1f5f9;
      --btn-sec-color: #1e293b;
      --btn-sec-border: #cbd5e1;
      --btn-sec-hover: #e2e8f0;
      --brand-tag: #64748b;
      --theme-btn-bg: rgba(0, 0, 0, 0.05);
      --theme-btn-color: #334155;
    }

    .dark-theme, body.dark-theme {
      --bg: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 80%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      --text-title: #f8fafc;
      --text-muted: #94a3b8;
      --btn-sec-bg: rgba(255, 255, 255, 0.08);
      --btn-sec-color: #f8fafc;
      --btn-sec-border: rgba(255, 255, 255, 0.12);
      --btn-sec-hover: rgba(255, 255, 255, 0.14);
      --brand-tag: #64748b;
      --theme-btn-bg: rgba(255, 255, 255, 0.1);
      --theme-btn-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-title);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .error-container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: var(--card-shadow);
      position: relative;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .theme-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--theme-btn-bg);
      color: var(--theme-btn-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.25s ease;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
    }

    .badge-code {
      display: inline-block;
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-title);
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(99, 102, 241, 0.65);
    }

    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-color);
      border: 1px solid var(--btn-sec-border);
    }

    .btn-secondary:hover {
      background: var(--btn-sec-hover);
      transform: translateY(-2px);
    }

    .brand-tag {
      margin-top: 36px;
      font-size: 0.82rem;
      color: var(--brand-tag);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Light / Dark Theme">
      <span id="themeIcon">🌙</span>
    </button>

    <div class="badge-code">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page or resource you are looking for might have been moved, renamed, or is temporarily unavailable on the ABCD Smart Campus platform.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
      <a href="/post-login/" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        My Dashboard
      </a>
    </div>

    <div class="brand-tag">
      ABCD Coaching & Smart Library Management Platform
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const body = document.body;
    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');

    function syncIcon() {
      const isDark = root.classList.contains('dark-theme') || body.classList.contains('dark-theme');
      if (icon) icon.textContent = isDark ? '☀️' : '🌙';
    }

    // Apply saved or system theme on DOM ready
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'dark-theme' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      root.classList.add('dark-theme');
      body.classList.add('dark-theme');
    } else {
      root.classList.remove('dark-theme');
      body.classList.remove('dark-theme');
    }
    syncIcon();

    // Toggle button handler
    if (btn) {
      btn.addEventListener('click', function() {
        const isDark = root.classList.toggle('dark-theme');
        body.classList.toggle('dark-theme', isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        syncIcon();
      });
    }
  </script>
</body>
</html>
