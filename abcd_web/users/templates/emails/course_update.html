{% extends "emails/base_email.html" %}

{% block content %}
<table width="100%" cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif;">
  <tr>
    <td style="padding: 10px 0;">
      <h2 style="color:#1f2937; margin-bottom:12px;">{{ title }}</h2>
      
      <p style="font-size:15px; color:#374151; line-height:1.6;">
        {{ message }}<br><br>
        <b>Course:</b> {{ course_name }}
      </p>

      <div style="margin:30px 0; text-align:center;">
        <a href="{% if action_url %}{{ action_url }}{% elif site_url %}{{ site_url }}{% url 'users:courses' %}{% else %}{% url 'users:courses' %}{% endif %}"
           style="background:#2563eb; color:#ffffff; padding:12px 26px; text-decoration:none; border-radius:6px; font-weight:600; display:inline-block;">
          View Courses
        </a>
      </div>
    </td>
  </tr>
</table>
{% endblock %}
