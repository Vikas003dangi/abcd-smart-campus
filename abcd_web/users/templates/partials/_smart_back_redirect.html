<script>
    (function() {
        const rawPath = window.location.pathname.toLowerCase();
        const cleanPath = rawPath.replace(/\/$/, '') || '/';
        
        // Home Base URLs where back navigation operates normally
        const isHomeBase = cleanPath === '' || 
                           cleanPath === '/' || 
                           cleanPath === '/home' || 
                           cleanPath === '/guest-home' ||
                           cleanPath === '/dashboard' || 
                           cleanPath === '/alumni/dashboard' || 
                           cleanPath === '/teacher' ||
                           cleanPath === '/profile/guest';

        if (!isHomeBase) {
            // Push history trap state immediately so browser back button triggers popstate
            try {
                window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
            } catch(e) {}
            
            window.addEventListener('popstate', async function(event) {
                // 1. Check custom page back hook (e.g. Guidy mobile chat close)
                if (typeof window.handleCustomSmartBack === 'function') {
                    try {
                        const handled = window.handleCustomSmartBack();
                        if (handled) {
                            try {
                                window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
                            } catch(e) {}
                            return;
                        }
                    } catch(err) {
                        console.warn('handleCustomSmartBack error:', err);
                    }
                }

                if (window.customBackConfirm) {
                    const ok = await window.customBackConfirm();
                    if (!ok) {
                        try {
                            window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
                        } catch(e) {}
                        return;
                    }
                    window.allowPageUnload = true;
                }

                // 2. Resolve explicit override paths or named routes
                let targetUrl = "{{ back_url_path|default:'' }}" || "{{ back_url|default:'' }}";
                
                const routeNameMap = {
                    'users:courses': "{% url 'users:courses' %}",
                    'users:teacher_courses': "{% url 'users:teacher_courses' %}",
                    'users:student_dashboard': "{% url 'users:student_dashboard' %}",
                    'users:teacher_dashboard': "{% url 'users:teacher_dashboard' %}",
                    'users:alumni_dashboard': "{% url 'users:alumni_dashboard' %}",
                    'users:home_page': "{% url 'users:home_page' %}"
                };

                if (routeNameMap[targetUrl]) {
                    targetUrl = routeNameMap[targetUrl];
                }

                // 3. Fallback: Path hierarchy detection for courses & teacher courses
                if (!targetUrl) {
                    if (cleanPath.startsWith('/courses/') && cleanPath !== '/courses') {
                        targetUrl = "{% url 'users:courses' %}";
                    } else if (cleanPath.startsWith('/teacher/courses/') && cleanPath !== '/teacher/courses') {
                        targetUrl = "{% url 'users:teacher_courses' %}";
                    }
                }

                if (targetUrl && (targetUrl.startsWith('/') || targetUrl.startsWith('http'))) {
                    window.location.replace(targetUrl);
                    return;
                }

                // Default behavior for all other sub-pages: Redirect directly to user's Home Base!
                window.location.replace("{% url 'users:smart_back_router' %}");
            });

            // Re-push history trap state on page visibility / focus / user interaction
            window.addEventListener('pageshow', function() {
                try {
                    window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
                } catch(e) {}
            });
        }
    })();

    // Global helper for back buttons in UI headers/navbars
    window.goBackOrHomeBase = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        window.location.replace("{% url 'users:smart_back_router' %}");
    };

    // Bottom Navigation Bar Zoom Preventer (Pinch-to-zoom on Mobile/Touchpad & Page zoom on PC)
    (function() {
        if (window.__bottomNavZoomPreventerAttached) return;
        window.__bottomNavZoomPreventerAttached = true;

        const initialDPR = window.devicePixelRatio || 1;

        function updateBottomBarZoom() {
            const bars = document.querySelectorAll('.bottom-nav-menu, .guest-bottom-nav');
            if (!bars || bars.length === 0) return;

            const vv = window.visualViewport;
            const scale = vv ? vv.scale : 1;
            const currentDPR = window.devicePixelRatio || 1;
            const pageZoom = currentDPR / initialDPR;
            const totalZoom = scale * pageZoom;

            bars.forEach(bar => {
                if (totalZoom <= 1.001 && totalZoom >= 0.999) {
                    bar.style.transform = '';
                    bar.style.transformOrigin = '';
                    bar.style.width = '';
                    bar.style.bottom = '';
                    bar.style.left = '';
                    return;
                }

                bar.style.transform = `scale(${1 / totalZoom})`;
                bar.style.transformOrigin = 'bottom left';

                if (vv) {
                    bar.style.width = `${vv.width * totalZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = `${vv.offsetLeft}px`;
                } else {
                    bar.style.width = `${window.innerWidth * pageZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = '0px';
                }
            });
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateBottomBarZoom);
            window.visualViewport.addEventListener('scroll', updateBottomBarZoom);
        }
        window.addEventListener('resize', updateBottomBarZoom);
        window.addEventListener('scroll', updateBottomBarZoom);

        updateBottomBarZoom();
        document.addEventListener('DOMContentLoaded', updateBottomBarZoom);
        window.addEventListener('load', updateBottomBarZoom);
    })();
</script>
