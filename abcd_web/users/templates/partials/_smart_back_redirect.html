{% load static %}
<script src="{% static 'js/abcd-nav.js' %}?v=3.0.0"></script>
<script>
    (function() {
        if (window.ABCDNav) {
            let targetUrl = "{{ back_url_path|default:'' }}" || "{{ back_url|default:'' }}";
            const routeNameMap = {
                'users:courses': "{% url 'users:courses' %}",
                'users:teacher_courses': "{% url 'users:teacher_courses' %}",
                'users:student_dashboard': "{% url 'users:student_dashboard' %}",
                'users:teacher_dashboard': "{% url 'users:teacher_dashboard' %}",
                'users:alumni_dashboard': "{% url 'users:alumni_dashboard' %}",
                'users:home_page': "{% url 'users:home_page' %}",
                'users:guest_page': "{% url 'users:guest_page' %}",
                'users:student_complaints': "{% url 'users:student_complaints' %}",
                'users:hall_of_fame': "{% url 'users:hall_of_fame' %}"
            };
            if (routeNameMap[targetUrl]) {
                targetUrl = routeNameMap[targetUrl];
            }

            window.ABCDNav.init({
                isBasePage: false,
                parentUrl: targetUrl,
                contextAware: {% if context_aware %}true{% else %}false{% endif %},
                homeBaseUrl: "{{ user_home_base_url|default:'/' }}",
                smartBackRouterUrl: "{% url 'users:smart_back_router' %}"
            });
        }
    })();
</script>
<script>
    // Bottom Navigation Bar Zoom Preventer (Pinch-to-zoom on Mobile/Touchpad & Page zoom on PC)
    (function() {
        if (window.__bottomNavZoomPreventerAttached) return;
        window.__bottomNavZoomPreventerAttached = true;

        const initialDPR = window.devicePixelRatio || 1;
        let isZoomApplied = false;
        let ticking = false;

        function updateBottomBarZoom() {
            const bars = document.querySelectorAll('.bottom-nav-menu, .guest-bottom-nav');
            if (!bars || bars.length === 0) return;

            const vv = window.visualViewport;
            const isKeyboard = vv && (window.innerHeight - vv.height > 140);
            const isSearchActive = document.body.classList.contains('mob-search-active');
            const isInputFocused = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');

            // If virtual keyboard is open or mobile search is active, hide bottom bar & do not clamp to keyboard
            if (isKeyboard || isSearchActive || (isInputFocused && window.innerWidth <= 768)) {
                document.body.classList.add('keyboard-open');
                return;
            } else {
                document.body.classList.remove('keyboard-open');
            }

            const scale = vv ? vv.scale : 1;
            const currentDPR = window.devicePixelRatio || 1;
            const pageZoom = currentDPR / initialDPR;
            const totalZoom = scale * pageZoom;

            if (totalZoom <= 1.04 && totalZoom >= 0.96) {
                if (isZoomApplied) {
                    bars.forEach(bar => {
                        bar.style.transform = '';
                        bar.style.transformOrigin = '';
                        bar.style.width = '';
                        bar.style.bottom = '';
                        bar.style.left = '';
                    });
                    isZoomApplied = false;
                }
                return;
            }

            isZoomApplied = true;
            bars.forEach(bar => {
                bar.style.transform = `scale(${1 / totalZoom})`;
                bar.style.transformOrigin = 'bottom left';

                if (vv) {
                    bar.style.width = `${vv.width * totalZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = `${vv.offsetLeft}px`;
                } else {
                    bar.style.width = `${window.innerWidth * pageZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = '0px';
                }
            });
        }

        function scheduleBottomBarUpdate() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(() => {
                    updateBottomBarZoom();
                    ticking = false;
                });
            }
        }

        function handleScrollUpdate() {
            const vv = window.visualViewport;
            if (vv && (vv.scale > 1.04 || vv.scale < 0.96 || isZoomApplied)) {
                scheduleBottomBarUpdate();
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleBottomBarUpdate, { passive: true });
            window.visualViewport.addEventListener('scroll', handleScrollUpdate, { passive: true });
        }
        window.addEventListener('resize', scheduleBottomBarUpdate, { passive: true });

        // Auto-highlight active tab based on current URL path
        function highlightActiveBottomNavItem() {
            const currentPath = (window.location.pathname.replace(/\/$/, '') || '/').toLowerCase();
            const navItems = document.querySelectorAll('.bottom-nav-menu .bnav-item, .guest-bottom-nav .bnav-item');
            if (!navItems || navItems.length === 0) return;

            let bestMatch = null;
            let bestMatchLen = 0;

            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (!href || href === '#' || href.startsWith('javascript:')) return;
                try {
                    const url = new URL(href, window.location.origin);
                    const itemPath = (url.pathname.replace(/\/$/, '') || '/').toLowerCase();

                    const isExactMatch = (itemPath === currentPath);
                    const isSegmentMatch = (itemPath !== '/' && currentPath.startsWith(itemPath + '/'));

                    if (isExactMatch) {
                        bestMatch = item;
                        bestMatchLen = Infinity;
                    } else if (isSegmentMatch && itemPath.length > bestMatchLen) {
                        bestMatch = item;
                        bestMatchLen = itemPath.length;
                    }
                } catch(e) {}
            });

            if (bestMatch) {
                navItems.forEach(item => item.classList.remove('active'));
                bestMatch.classList.add('active');
            }
        }

        updateBottomBarZoom();
        highlightActiveBottomNavItem();
        document.addEventListener('DOMContentLoaded', () => {
            updateBottomBarZoom();
            highlightActiveBottomNavItem();
        });
        window.addEventListener('load', () => {
            updateBottomBarZoom();
            highlightActiveBottomNavItem();
        });

        // Ensure ABCD Audio Engine is globally available on all pages
        if (!window.playABCDSound && !document.querySelector('script[src*="abcd-sound.js"]')) {
            const snd = document.createElement('script');
            snd.src = '/static/js/abcd-sound.js';
            snd.async = true;
            document.head.appendChild(snd);
        }

        // Ensure Web Push & Service Worker subscription sync is active on all pages
        if (!document.querySelector('script[src*="push-permission.js"]')) {
            const pp = document.createElement('script');
            pp.src = '/static/js/push-permission.js?v=6';
            pp.async = true;
            document.head.appendChild(pp);
        }


        // Universal Custom Color Picker for all pages
        if (!window.openCustomColorPickerBoard && !document.querySelector('script[src*="abcd-color-picker.js"]')) {
            const cp = document.createElement('script');
            cp.src = '/static/js/abcd-color-picker.js?v=1';
            cp.async = true;
            document.head.appendChild(cp);
        }

        // Ensure Universal CustomPopup is globally available on all pages
        if (!window.CustomPopup && !document.querySelector('script[src*="custom-popup.js"]')) {
            const cp = document.createElement('script');
            cp.src = '/static/js/custom-popup.js?v=20260918';
            cp.async = true;
            document.head.appendChild(cp);
        }

        // On non-form pages, clicking legal links clears any previous form return toast
        document.addEventListener('click', function(e) {
            const target = e.target ? e.target.closest('a') : null;
            if (target && target.href && (target.href.includes('/terms') || target.href.includes('/privacy'))) {
                const path = window.location.pathname.toLowerCase();
                const isFormPage = path.includes('admission') || 
                                   path.includes('achievement') || 
                                   path.includes('register') ||
                                   path.includes('login') ||
                                   path.includes('terms') ||
                                   path.includes('privacy');
                if (!isFormPage) {
                    try { sessionStorage.removeItem('abcd_legal_return_info'); } catch(err) {}
                }
            }
        }, true);
    })();
</script>
