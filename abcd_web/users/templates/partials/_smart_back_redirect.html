<script>
    (function() {
        const rawPath = window.location.pathname.toLowerCase();
        const cleanPath = rawPath.replace(/\/$/, '') || '/';
        
        // Home Base URLs where back navigation operates normally
        const isHomeBase = cleanPath === '' || 
                           cleanPath === '/' || 
                           cleanPath === '/home' || 
                           cleanPath === '/guest-home' ||
                           cleanPath === '/dashboard' || 
                           cleanPath === '/alumni/dashboard' || 
                           cleanPath === '/teacher';

        if (!isHomeBase) {
            // Push history trap state only if not already pushed (prevents duplicate state stacking)
            function ensureTrap() {
                try {
                    if (!history.state || !history.state.abcd_back_trap) {
                        window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
                    }
                } catch(e) {}
            }

            ensureTrap();
            // User interaction reinforces trap for mobile/desktop browsers (satisfies user-gesture requirements)
            window.addEventListener('pointerdown', ensureTrap, { once: true, passive: true });
            
            window.addEventListener('popstate', async function(event) {
                // 1. Check custom page back hook (e.g. Guidy mobile chat close)
                if (typeof window.handleCustomSmartBack === 'function') {
                    try {
                        const handled = window.handleCustomSmartBack();
                        if (handled) {
                            try {
                                window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
                            } catch(e) {}
                            return;
                        }
                    } catch(err) {
                        console.warn('handleCustomSmartBack error:', err);
                    }
                }

                if (window.customBackConfirm) {
                    const ok = await window.customBackConfirm();
                    if (!ok) {
                        try {
                            window.history.pushState({ abcd_back_trap: true }, document.title, window.location.href);
                        } catch(e) {}
                        return;
                    }
                    window.allowPageUnload = true;
                }

                // 2. Resolve explicit override paths or named routes
                let targetUrl = "{{ back_url_path|default:'' }}" || "{{ back_url|default:'' }}";
                
                const routeNameMap = {
                    'users:courses': "{% url 'users:courses' %}",
                    'users:teacher_courses': "{% url 'users:teacher_courses' %}",
                    'users:student_dashboard': "{% url 'users:student_dashboard' %}",
                    'users:teacher_dashboard': "{% url 'users:teacher_dashboard' %}",
                    'users:alumni_dashboard': "{% url 'users:alumni_dashboard' %}",
                    'users:home_page': "{% url 'users:home_page' %}",
                    'users:guest_page': "{% url 'users:guest_page' %}",
                    'users:student_complaints': "{% url 'users:student_complaints' %}",
                    'users:hall_of_fame': "{% url 'users:hall_of_fame' %}"
                };

                if (routeNameMap[targetUrl]) {
                    targetUrl = routeNameMap[targetUrl];
                }

                // 3. Fallback: Context-aware referrer detection (e.g. Hall of Fame)
                {% if context_aware %}
                if (!targetUrl && document.referrer && document.referrer.includes('/hall-of-fame')) {
                    targetUrl = "{% url 'users:hall_of_fame' %}";
                }
                {% endif %}

                // 4. Fallback: Path hierarchy detection for courses & teacher courses
                if (!targetUrl) {
                    if (cleanPath.startsWith('/courses/') && cleanPath !== '/courses') {
                        targetUrl = "{% url 'users:courses' %}";
                    } else if (cleanPath.startsWith('/teacher/courses/') && cleanPath !== '/teacher/courses') {
                        targetUrl = "{% url 'users:teacher_courses' %}";
                    }
                }

                if (targetUrl && (targetUrl.startsWith('/') || targetUrl.startsWith('http'))) {
                    window.location.replace(targetUrl);
                    return;
                }

                // Default behavior for all other sub-pages: Redirect directly to user's Home Base!
                const directHomeBase = "{{ user_home_base_url|default:'' }}" || "{% url 'users:smart_back_router' %}";
                window.location.replace(directHomeBase);
            });

            // Re-push history trap state on page visibility / focus
            window.addEventListener('pageshow', function(e) {
                if (e.persisted) {
                    ensureTrap();
                }
            });
        }
    })();

    // Global helper for back buttons in UI headers/navbars
    window.goBackOrHomeBase = function(e) {
        if (e && e.preventDefault) e.preventDefault();
        window.location.replace("{% url 'users:smart_back_router' %}");
    };

    // Bottom Navigation Bar Zoom Preventer (Pinch-to-zoom on Mobile/Touchpad & Page zoom on PC)
    (function() {
        if (window.__bottomNavZoomPreventerAttached) return;
        window.__bottomNavZoomPreventerAttached = true;

        const initialDPR = window.devicePixelRatio || 1;
        let isZoomApplied = false;
        let ticking = false;

        function updateBottomBarZoom() {
            const bars = document.querySelectorAll('.bottom-nav-menu, .guest-bottom-nav');
            if (!bars || bars.length === 0) return;

            const vv = window.visualViewport;
            const scale = vv ? vv.scale : 1;
            const currentDPR = window.devicePixelRatio || 1;
            const pageZoom = currentDPR / initialDPR;
            const totalZoom = scale * pageZoom;

            if (totalZoom <= 1.001 && totalZoom >= 0.999) {
                if (isZoomApplied) {
                    bars.forEach(bar => {
                        bar.style.transform = '';
                        bar.style.transformOrigin = '';
                        bar.style.width = '';
                        bar.style.bottom = '';
                        bar.style.left = '';
                    });
                    isZoomApplied = false;
                }
                return;
            }

            isZoomApplied = true;
            bars.forEach(bar => {
                bar.style.transform = `scale(${1 / totalZoom})`;
                bar.style.transformOrigin = 'bottom left';

                if (vv) {
                    bar.style.width = `${vv.width * totalZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = `${vv.offsetLeft}px`;
                } else {
                    bar.style.width = `${window.innerWidth * pageZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = '0px';
                }
            });
        }

        function scheduleBottomBarUpdate() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(() => {
                    updateBottomBarZoom();
                    ticking = false;
                });
            }
        }

        function handleScrollUpdate() {
            const vv = window.visualViewport;
            if (vv && (vv.scale > 1.01 || vv.scale < 0.99 || isZoomApplied)) {
                scheduleBottomBarUpdate();
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleBottomBarUpdate, { passive: true });
            window.visualViewport.addEventListener('scroll', handleScrollUpdate, { passive: true });
        }
        window.addEventListener('resize', scheduleBottomBarUpdate, { passive: true });

        updateBottomBarZoom();
        document.addEventListener('DOMContentLoaded', updateBottomBarZoom);
        window.addEventListener('load', updateBottomBarZoom);

        // Ensure ABCD Audio Engine is globally available on all pages
        if (!window.playABCDSound && !document.querySelector('script[src*="abcd-sound.js"]')) {
            const snd = document.createElement('script');
            snd.src = '/static/js/abcd-sound.js';
            snd.async = true;
            document.head.appendChild(snd);
        }

        // Universal Background Scroll Lock for any Modal / Popup
        if (!window.__ABCD_MODAL_SCROLL_LOCK__ && !document.querySelector('script[src*="abcd-modal-scroll-lock.js"]')) {
            const msl = document.createElement('script');
            msl.src = '/static/js/abcd-modal-scroll-lock.js?v=1';
            msl.async = true;
            document.head.appendChild(msl);
        }

        // Universal Custom Color Picker for all pages
        if (!window.openCustomColorPickerBoard && !document.querySelector('script[src*="abcd-color-picker.js"]')) {
            const cp = document.createElement('script');
            cp.src = '/static/js/abcd-color-picker.js?v=1';
            cp.async = true;
            document.head.appendChild(cp);
        }
    })();
</script>
