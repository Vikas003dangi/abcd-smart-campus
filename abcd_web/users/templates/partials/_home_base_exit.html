{% load static %}
<style>

        background: #181d29 !important;
        border-color: rgba(255, 255, 255, 0.12) !important;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65) !important;

    body.dark-theme #abcdExitModal #abcdExitPrompt {
        color: #f1f5f9 !important;

    body.dark-theme #abcdExitModal p {

    }
    body.dark-theme #abcdExitCancelBtn {

    body.dark-theme #abcdExitCancelBtn:hover {

    }
    body.dark-theme #abcdExitConfirmBtn:hover {
        background: rgba(232, 69, 90, 0.26) !important;
        border-color: #ff4757 !important;
        color: #ff4757 !important;
    }
    @keyframes abcdExitModalShake {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        20%, 60% { transform: translate(-52%, -50%) scale(1); }
        40%, 80% { transform: translate(-48%, -50%) scale(1); }
    }
    .abcd-exit-modal-shake {
        animation: abcdExitModalShake 0.32s ease-in-out !important;
    }
</style>

<!-- ================= ABCD UNIVERSAL EXIT CONFIRMATION MODAL ================= -->
<div id="abcdExitOverlay" class="abcd-exit-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;z-index:3000100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity 0.22s ease;"></div>
<div id="abcdExitModal" class="abcd-exit-modal" role="dialog" aria-modal="true" aria-labelledby="abcdExitTitle" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.92);background:#ffffff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,0.35);width:min(400px,88vw);display:none;z-index:3000101;opacity:0;transition:opacity 0.22s ease, transform 0.22s cubic-bezier(0.34,1.56,0.64,1);overflow:hidden;border:1px solid rgba(0,0,0,0.08);">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);color:#ffffff;">
        <div style="display:flex;align-items:center;gap:10px;">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:rgba(232,69,90,0.22);color:#ff6b7d;font-size:1.25rem;">
                <i class='bx bx-exit'></i>
            </span>
            <h3 id="abcdExitTitle" style="margin:0;font-size:1.08rem;font-weight:700;letter-spacing:0.2px;color:#ffffff;">Exit ABCD Smart Campus</h3>
        </div>
        <button type="button" id="abcdExitCloseBtn" aria-label="Close" style="background:none;border:none;font-size:1.6rem;cursor:pointer;color:#94a3b8;line-height:1;transition:color 0.15s, transform 0.15s;padding:0;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;" onmouseover="this.style.color='#ffffff';this.style.transform='scale(1.1)'" onmouseout="this.style.color='#94a3b8';this.style.transform='scale(1)'">&times;</button>
    </div>
    <div style="padding:24px 22px 16px;text-align:center;">
        <p style="margin:0 0 8px;font-size:1.02rem;font-weight:700;color:#0f172a;" id="abcdExitPrompt">Are you sure you want to exit?</p>
        <p style="margin:0;font-size:0.86rem;color:#64748b;line-height:1.45;">Press <strong>Exit</strong> to close the application or leave the site. You can return anytime.</p>
    </div>
    <div style="padding:14px 22px 20px;display:flex;gap:12px;justify-content:center;">
        <button type="button" id="abcdExitCancelBtn" style="flex:1;padding:10px 18px;font-weight:600;border:1.5px solid #cbd5e1;border-radius:10px;cursor:pointer;background:#ffffff;color:#334155;font-size:0.92rem;transition:all 0.15s ease;" onmouseover="this.style.borderColor='#94a3b8';this.style.background='#f8fafc'" onmouseout="this.style.borderColor='#cbd5e1';this.style.background='#ffffff'">Cancel</button>
        <button type="button" id="abcdExitConfirmBtn" style="flex:1;padding:10px 18px;font-weight:700;border:1.5px solid #e8455a;border-radius:10px;cursor:pointer;background:rgba(232,69,90,0.08);color:#e8455a;font-size:0.92rem;transition:all 0.15s ease;" onmouseover="this.style.background='rgba(232,69,90,0.18)';this.style.borderColor='#c0392b';this.style.color='#c0392b'" onmouseout="this.style.background='rgba(232,69,90,0.08)';this.style.borderColor='#e8455a';this.style.color='#e8455a'">Exit</button>
    </div>
</div>

<script>
    (function() {
        const rawPath = window.location.pathname.toLowerCase();
        const cleanPath = rawPath.replace(/\/$/, '') || '/';
        const isHomeBase = cleanPath === '/' || 
                           cleanPath === '/home' ||
                           cleanPath === '/guest-home' || 
                           cleanPath === '/dashboard' || 
                           cleanPath === '/alumni/dashboard' || 
                           cleanPath === '/teacher';

        if (!isHomeBase) return;

        let isModalVisible = false;
        let isExiting = false;
        let trapArmed = false;
        let openedByBackButton = false;
        let overlay = null;
        let modal = null;
        let cancelBtn = null;
        let confirmBtn = null;
        let closeBtn = null;

        function getDOMElements() {
            if (!overlay) overlay = document.getElementById('abcdExitOverlay');
            if (!modal) modal = document.getElementById('abcdExitModal');
            if (!cancelBtn) cancelBtn = document.getElementById('abcdExitCancelBtn');
            if (!confirmBtn) confirmBtn = document.getElementById('abcdExitConfirmBtn');
            if (!closeBtn) closeBtn = document.getElementById('abcdExitCloseBtn');
        }

        // 1. Single-Trap History Setup: exactly ONE state so Back press pops to root
        function armTrap() {
            if (isExiting || trapArmed) return;
            try {
                if (!history.state || !history.state.abcd_exit_trap) {
                    window.history.pushState({ abcd_exit_trap: true }, document.title, window.location.href);
                }
                trapArmed = true;
            } catch(e) {}
        }

        armTrap();

        function showExitModal() {
            if (isExiting) return;
            getDOMElements();
            if (!overlay || !modal) return;

            if (isModalVisible) {
                modal.classList.remove('abcd-exit-modal-shake');
                void modal.offsetWidth;
                modal.classList.add('abcd-exit-modal-shake');
                return;
            }

            isModalVisible = true;

            var highestZ = 3000100;
            if (typeof window.getHighestZIndex === 'function') {
                highestZ = Math.max(highestZ, window.getHighestZIndex([overlay, modal]));
            }
            overlay.style.setProperty('z-index', highestZ.toString(), 'important');
            modal.style.setProperty('z-index', (highestZ + 1).toString(), 'important');

            overlay.style.display = 'block';
            modal.style.display = 'block';
            void modal.offsetWidth;

            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            modal.style.opacity = '1';
            modal.style.transform = 'translate(-50%, -50%) scale(1)';

            if (typeof window.syncModalScrollLock === 'function') {
                window.syncModalScrollLock();
            }

            if (cancelBtn) cancelBtn.focus();
        }

        function hideExitModal() {
            getDOMElements();
            if (!overlay || !modal) return;
            isModalVisible = false;

            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            modal.style.opacity = '0';
            modal.style.transform = 'translate(-50%, -50%) scale(0.92)';

            setTimeout(function() {
                if (!isModalVisible) {
                    overlay.style.display = 'none';
                    modal.style.display = 'none';
                    if (typeof window.syncModalScrollLock === 'function') {
                        window.syncModalScrollLock();
                    }
                }
            }, 220);
        }

        function onCancelExit() {
            hideExitModal();
            openedByBackButton = false;
            // Re-arm trap so the user can be prompted on future Back press
            armTrap();
        }

        function doActualExit() {
            isExiting = true;

            const isAndroid = /android/i.test(navigator.userAgent || '');
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                                 window.matchMedia('(display-mode: fullscreen)').matches ||
                                 window.navigator.standalone === true ||
                                 (document.referrer && document.referrer.startsWith('android-app://')) ||
                                 window.location.search.includes('pwa_app=1');

            // =========================================================================
            // ENVIRONMENT 1: ANDROID TWA / MOBILE APP (Option 2 - Native Task Exit)
            // =========================================================================
            if (isAndroid || isStandalone) {
                // A. Native WebView JS bridge (if present)
                if (window.AndroidApp && typeof window.AndroidApp.closeApp === 'function') {
                    try { window.AndroidApp.closeApp(); return; } catch(e) {}
                }
                if (window.Android && typeof window.Android.exitApp === 'function') {
                    try { window.Android.exitApp(); return; } catch(e) {}
                }
                if (window.Android && typeof window.Android.finish === 'function') {
                    try { window.Android.finish(); return; } catch(e) {}
                }

                // B. Try closing window directly
                try { window.close(); } catch(e) {}

                // C. Trigger native ExitActivity / LauncherActivity via explicit Android Intent URI
                try {
                    window.location.href = "intent:#Intent;action=in.abcdcampus.app.EXIT;package=in.abcdcampus.app;component=in.abcdcampus.app/.ExitActivity;end";
                } catch(e) {}

                // D. Fallback to custom exit scheme
                setTimeout(function() {
                    try {
                        window.location.href = "abcdexit://close";
                    } catch(e) {}
                }, 80);

                // E. Final fallback: pop web history
                const steps = openedByBackButton ? -1 : (trapArmed ? -2 : -1);
                setTimeout(function() {
                    try { window.history.go(steps); } catch(e) {}
                    try { window.close(); } catch(e) {}
                }, 160);
                return;
            }

            // =========================================================================
            // ENVIRONMENT 2: LAPTOP / DESKTOP BROWSER
            // =========================================================================
            // "When the website is opened as a normal browser window/tab and the user clicks Exit,
            // I want the browser page/window to close completely if the browser technically permits it.
            // Never use a blank/black page as a substitute for closing.
            // If the browser permits it: close.
            // Otherwise preserve the existing page rather than showing a fake blank/black screen."

            try {
                window.close();
            } catch(e) {}

            // If the browser prohibited JavaScript from closing a user-opened tab:
            // Check after a brief delay if the page is still active.
            // If still active, do NOT redirect to about:blank or any blank page.
            // Keep the page perfectly preserved and inform the user.
            setTimeout(function() {
                if (!document.hidden) {
                    isExiting = false;
                    armTrap();
                    if (typeof window.showToast === 'function') {
                        window.showToast("Your browser prevented closing this tab automatically. You can close it using Ctrl+W (or \u2318+W).", "info");
                    }
                }
            }, 300);
        }

        function executeExit() {
            hideExitModal();
            doActualExit();
        }

        // 2. Popstate: when user presses Android/Browser back, browser pops the trap!
        // DO NOT re-push state here so the browser stays at the true root entry.
        window.addEventListener('popstate', function(event) {
            if (isExiting) return;
            trapArmed = false;
            openedByBackButton = true;
            showExitModal();
        });

        // 3. Bind UI event listeners
        function initModalEvents() {
            getDOMElements();
            if (cancelBtn) cancelBtn.addEventListener('click', onCancelExit);
            if (closeBtn) closeBtn.addEventListener('click', onCancelExit);
            if (overlay) overlay.addEventListener('click', onCancelExit);
            if (confirmBtn) confirmBtn.addEventListener('click', executeExit);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isModalVisible) {
                    onCancelExit();
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initModalEvents);
        } else {
            initModalEvents();
        }

        // 4. Anti-bfcache: If restored from browser bfcache, reload to verify authentication
        window.addEventListener('pageshow', function(e) {
            if (isExiting) return;
            if (e.persisted) {
                window.location.reload();
            } else {
                armTrap();
            }
        });
    })();

    // Bottom Navigation Bar Zoom Preventer (Pinch-to-zoom on Mobile/Touchpad & Page zoom on PC)
    (function() {
        if (window.__bottomNavZoomPreventerAttached) return;
        window.__bottomNavZoomPreventerAttached = true;

        const initialDPR = window.devicePixelRatio || 1;
        let cachedBars = null;
        let isZoomApplied = false;
        let ticking = false;

        function updateBottomBarZoom() {
            if (!cachedBars || cachedBars.length === 0) {
                cachedBars = document.querySelectorAll('.bottom-nav-menu, .guest-bottom-nav');
            }
            if (!cachedBars || cachedBars.length === 0) return;

            const vv = window.visualViewport;
            const isKeyboard = vv && (window.innerHeight - vv.height > 140);
            const isSearchActive = document.body.classList.contains('mob-search-active');
            const isInputFocused = document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA');

            // If virtual keyboard is open or mobile search is active, hide bottom bar & do not clamp to keyboard
            if (isKeyboard || isSearchActive || (isInputFocused && window.innerWidth <= 768)) {
                document.body.classList.add('keyboard-open');
                return;
            } else {
                document.body.classList.remove('keyboard-open');
            }

            const scale = vv ? vv.scale : 1;
            const currentDPR = window.devicePixelRatio || 1;
            const pageZoom = currentDPR / initialDPR;
            const totalZoom = scale * pageZoom;

            // Only apply transform overrides if user is actively zoomed
            if (totalZoom <= 1.04 && totalZoom >= 0.96) {
                if (isZoomApplied) {
                    cachedBars.forEach(bar => {
                        bar.style.transform = '';
                        bar.style.transformOrigin = '';
                        bar.style.width = '';
                        bar.style.bottom = '';
                        bar.style.left = '';
                    });
                    isZoomApplied = false;
                }
                return;
            }

            isZoomApplied = true;
            cachedBars.forEach(bar => {
                bar.style.transform = `scale(${1 / totalZoom})`;
                bar.style.transformOrigin = 'bottom left';

                if (vv) {
                    bar.style.width = `${vv.width * totalZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = `${vv.offsetLeft}px`;
                } else {
                    bar.style.width = `${window.innerWidth * pageZoom}px`;
                    bar.style.bottom = '0px';
                    bar.style.left = '0px';
                }
            });
        }

        function scheduleBottomBarUpdate() {
            if (!ticking) {
                ticking = true;
                requestAnimationFrame(() => {
                    updateBottomBarZoom();
                    ticking = false;
                });
            }
        }

        function handleScrollUpdate() {
            const vv = window.visualViewport;
            if (vv && (vv.scale > 1.04 || vv.scale < 0.96 || isZoomApplied)) {
                scheduleBottomBarUpdate();
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleBottomBarUpdate, { passive: true });
            window.visualViewport.addEventListener('scroll', handleScrollUpdate, { passive: true });
        }
        window.addEventListener('resize', scheduleBottomBarUpdate, { passive: true });

        // Auto-highlight active tab based on current URL path
        function highlightActiveBottomNavItem() {
            const currentPath = (window.location.pathname.replace(/\/$/, '') || '/').toLowerCase();
            const navItems = document.querySelectorAll('.bottom-nav-menu .bnav-item, .guest-bottom-nav .bnav-item');
            if (!navItems || navItems.length === 0) return;

            let bestMatch = null;
            let bestMatchLen = 0;

            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (!href || href === '#' || href.startsWith('javascript:')) return;
                try {
                    const url = new URL(href, window.location.origin);
                    const itemPath = (url.pathname.replace(/\/$/, '') || '/').toLowerCase();

                    const isExactMatch = (itemPath === currentPath);
                    const isSegmentMatch = (itemPath !== '/' && currentPath.startsWith(itemPath + '/'));

                    if (isExactMatch) {
                        bestMatch = item;
                        bestMatchLen = Infinity;
                    } else if (isSegmentMatch && itemPath.length > bestMatchLen) {
                        bestMatch = item;
                        bestMatchLen = itemPath.length;
                    }
                } catch(e) {}
            });

            if (bestMatch) {
                navItems.forEach(item => item.classList.remove('active'));
                bestMatch.classList.add('active');
            }
        }

        // Run immediately and on page load events
        updateBottomBarZoom();
        highlightActiveBottomNavItem();
        document.addEventListener('DOMContentLoaded', () => {
            updateBottomBarZoom();
            highlightActiveBottomNavItem();
        });
        window.addEventListener('load', () => {
            updateBottomBarZoom();
            highlightActiveBottomNavItem();
        });
    })();
</script>
