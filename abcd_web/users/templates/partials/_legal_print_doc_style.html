{% load static %}
<!-- ==========================================================================
     ABCD SMART CAMPUS - FORMAL LEGAL DOCUMENT PRINT / PDF STYLESHEET & ASSETS
     Pure white paper background, formal dark ink, institutional typography,
     generous paper margins (22mm top/bottom, 18mm left/right), dead-center
     faded background watermark (ABCD Campus) on every page, running corner header
     with "ABCD Campus | {doc_title} | Page X of Y", and client-only PDF generation.
========================================================================== -->

<!-- Watermark: Dead-center SVG vector fixed across all printed pages (Layer z-index: 1) -->
<div class="legal-print-watermark" aria-hidden="true">
  <svg class="print-watermark-svg" viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(300, 300) rotate(-35)">
      <text x="0" y="-12" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="115" font-weight="900" fill="#1e293b" fill-opacity="0.10" letter-spacing="14">ABCD</text>
      <text x="0" y="62" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#1e293b" fill-opacity="0.12" letter-spacing="18">CAMPUS</text>
    </g>
  </svg>
</div>

<style>
  /* --------------------------------------------------------------------------
     SCREEN STYLES: Hidden on screen, active ONLY during Print / Save PDF
     -------------------------------------------------------------------------- */
  .legal-print-watermark,
  .legal-print-sign-off {
    display: none;
  }

  /* --------------------------------------------------------------------------
     PRINT / PDF EXPORT ENGINE: Pure Formal Document Layout
     -------------------------------------------------------------------------- */
  @media print {
    @page {
      size: A4 portrait;
      /* Generous formal paper margins: leaves proper breathing room on all 4 edges */
      margin: 22mm 18mm 20mm 18mm;
      @top-right {
        content: "ABCD Campus | {{ doc_title|default:'Official Legal Policy' }} | Page " counter(page) " of " counter(pages);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 8pt;
        color: #64748b;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      @bottom-right {
        content: "ABCD Smart Campus • Ganj Basoda (M.P.) • Official Statutory Document";
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 7.5pt;
        color: #94a3b8;
      }
    }

    /* 1. Reset Colors for Paper: No gradients, no dark backgrounds, no web shadows */
    *, *::before, *::after {
      box-shadow: none !important;
      text-shadow: none !important;
      filter: none !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    html, body {
      background: #ffffff !important;
      color: #0f172a !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
      font-size: 9.2pt !important;
      line-height: 1.52 !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
    }

    /* Content container elevated above the watermark with safe internal margin */
    .legal-wrapper {
      position: relative !important;
      z-index: 2 !important;
      background: transparent !important;
      box-sizing: border-box !important;
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 auto !important;
      padding: 0 4mm !important; /* Ensures text never hugs the physical edge */
      color: #0f172a !important;
    }

    /* 2. Hide ALL Web Navigation, Tabs, Buttons & Chrome */
    header.top-nav-menu,
    .top-nav-menu,
    nav.navbar,
    .navbar,
    .sidebar-wrapper,
    .sidebar,
    .bottom-nav-menu,
    .guest-bottom-nav,
    .mob-bottom-bar,
    footer,
    .site-footer,
    .footer,
    .legal-top-bar,
    .legal-tabs-container,
    .toc-card,
    .cross-link-card,
    .legal-floating-pdf-btn,
    .legal-return-toast,
    #scrollToTopBtn,
    .scroll-to-top,
    .back-btn,
    .theme-toggle,
    .pwa-install-banner,
    .master-loader-overlay,
    .modal,
    .modal-overlay-styled,
    .admission-modal-styled,
    #statusModal,
    #statusModalOverlay,
    .messages-container,
    script,
    style {
      display: none !important;
    }

    /* 3. Faint Background Watermark: Dead-center on every page */
    .legal-print-watermark {
      display: block !important;
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 440pt !important;
      height: 440pt !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 1 !important;
      pointer-events: none !important;
      opacity: 1 !important;
      overflow: visible !important;
    }

    .print-watermark-svg {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      overflow: visible !important;
    }

    /* 4. Formal Institutional Header (Clean Paper Styling) */
    .legal-hero {
      background: transparent !important;
      border: none !important;
      border-bottom: 1.5pt solid #0f172a !important;
      border-radius: 0 !important;
      padding: 0 0 10pt 0 !important;
      margin-bottom: 14pt !important;
      box-shadow: none !important;
      page-break-after: avoid;
      break-after: avoid;
    }

    .hero-kicker {
      display: block !important;
      font-size: 8pt !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.12em !important;
      color: #475569 !important;
      margin-bottom: 3pt !important;
      border: none !important;
      padding: 0 !important;
      background: none !important;
    }

    .hero-kicker i {
      display: none !important;
    }

    .hero-title-group h1 {
      font-size: 19pt !important;
      font-weight: 800 !important;
      color: #0f172a !important;
      line-height: 1.18 !important;
      margin: 0 0 5pt 0 !important;
      letter-spacing: -0.02em !important;
    }

    .hero-title-group h1 i {
      display: none !important;
    }

    .hero-subtitle {
      font-size: 9.2pt !important;
      line-height: 1.48 !important;
      color: #334155 !important;
      margin: 0 0 8pt 0 !important;
      text-align: justify !important;
    }

    .hero-badges-wrap {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: 6pt 16pt !important;
      margin-top: 6pt !important;
      padding-top: 6pt !important;
      border-top: 0.5pt solid #cbd5e1 !important;
    }

    .hero-badge-pill {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      font-size: 8pt !important;
      color: #475569 !important;
      border-radius: 0 !important;
    }

    .hero-badge-pill i {
      display: none !important;
    }

    .hero-badge-pill strong {
      color: #0f172a !important;
    }

    /* 5. Legal Sections & Cards: Avoid Awkward Breaks */
    .legal-card {
      background: transparent !important;
      border: none !important;
      border-bottom: 0.5pt solid #e2e8f0 !important;
      border-radius: 0 !important;
      padding: 8pt 0 10pt 0 !important;
      margin: 0 0 8pt 0 !important;
      box-shadow: none !important;
      color: #0f172a !important;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .legal-card:last-of-type {
      border-bottom: none !important;
    }

    .legal-card h2 {
      font-size: 11.5pt !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      margin: 0 0 5pt 0 !important;
      display: flex !important;
      align-items: center !important;
      gap: 5pt !important;
      page-break-after: avoid;
      break-after: avoid;
    }

    .legal-card h2 i {
      display: none !important;
    }

    .sec-num {
      background: #0f172a !important;
      color: #ffffff !important;
      font-size: 7.5pt !important;
      font-weight: 700 !important;
      padding: 1pt 4.5pt !important;
      border-radius: 2.5pt !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .legal-card h3 {
      font-size: 9.8pt !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      margin: 6pt 0 3pt 0 !important;
      page-break-after: avoid;
      break-after: avoid;
    }

    .legal-card p,
    .legal-card li {
      font-size: 9pt !important;
      line-height: 1.52 !important;
      color: #1e293b !important;
      margin-bottom: 4pt !important;
      text-align: justify !important;
    }

    .legal-card ul {
      margin: 3pt 0 6pt 16pt !important;
      padding: 0 !important;
    }

    .legal-card strong {
      color: #0f172a !important;
      font-weight: 700 !important;
    }

    .legal-card a {
      color: #0f172a !important;
      text-decoration: underline !important;
    }

    /* Formal Callouts */
    .legal-callout {
      background: rgba(248, 250, 252, 0.9) !important;
      border: 0.5pt solid #cbd5e1 !important;
      border-left: 3pt solid #0f172a !important;
      border-radius: 3pt !important;
      padding: 6pt 10pt !important;
      margin: 6pt 0 !important;
      color: #1e293b !important;
      font-size: 8.8pt !important;
      line-height: 1.45 !important;
      page-break-inside: avoid;
      break-inside: avoid;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .legal-callout.highlight {
      background: rgba(241, 245, 249, 0.95) !important;
      border-left-color: #0f172a !important;
    }

    /* 6. Section 11 Administration Contact Desk: Clean Table Grid */
    .contact-desk-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 6pt !important;
      margin-top: 6pt !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    .contact-desk-item {
      border: 0.5pt solid #cbd5e1 !important;
      border-radius: 3pt !important;
      padding: 6pt 10pt !important;
      background: rgba(248, 250, 252, 0.85) !important;
      box-sizing: border-box !important;
    }

    .contact-desk-icon-box {
      display: none !important;
    }

    .contact-desk-info h4 {
      font-size: 8.5pt !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      margin: 0 0 2pt 0 !important;
    }

    .contact-desk-info p {
      font-size: 8pt !important;
      color: #334155 !important;
      margin: 0 !important;
      line-height: 1.35 !important;
    }

    /* 7. Institutional Sign-Off Block (Aligned & Fit Within Margins) */
    .legal-print-sign-off {
      display: block !important;
      margin-top: 14pt !important;
      padding-top: 8pt !important;
      border-top: 1.2pt solid #0f172a !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    .print-sign-grid {
      display: flex !important;
      justify-content: space-between !important;
      align-items: flex-end !important;
      font-size: 8pt !important;
      color: #475569 !important;
      box-sizing: border-box !important;
      width: 100% !important;
      padding: 0 4pt !important;
    }

    .print-sign-col {
      flex: 1 !important;
      box-sizing: border-box !important;
    }

    .print-sign-col p {
      margin: 1.5pt 0 !important;
      line-height: 1.32 !important;
    }

    .print-sign-right {
      text-align: right !important;
      flex: 1 !important;
      box-sizing: border-box !important;
      padding-right: 6pt !important;
    }

    .print-seal-line {
      font-weight: 700 !important;
      color: #0f172a !important;
      margin-top: 16pt !important;
      border-top: 0.8pt solid #0f172a !important;
      display: inline-block !important;
      padding-top: 3pt !important;
      width: 150pt !important;
      max-width: 100% !important;
      font-size: 8pt !important;
    }
  }
</style>

<!-- Institutional Print Sign-Off (rendered only on print at the bottom of document) -->
<div class="legal-print-sign-off" aria-hidden="true">
  <div class="print-sign-grid">
    <div class="print-sign-col">
      <p><strong>Issued By:</strong> ABCD Smart Campus Administration</p>
      <p>Ganj Basoda, District Vidisha, Madhya Pradesh - 464221</p>
      <p>Official Statutory Gazette Copy &nbsp;|&nbsp; DPDP Act, 2023 Compliant</p>
    </div>
    <div class="print-sign-col print-sign-right">
      <p><strong>Approved & Authenticated:</strong></p>
      <div class="print-seal-line">Managing Director / Authorized Signatory</div>
      <p style="font-size: 7.5pt; color: #64748b; margin-top: 1pt;">ABCD Coaching & Library</p>
    </div>
  </div>
</div>

<script>
(function() {
  // Enhance Print Button & PDF Filename (Local Client-Side Only - 0 bytes saved on server/db)
  function setupPdfPrintFilename() {
    const docTitle = "{{ doc_title|default:'Legal_Document' }}".replace(/[^a-zA-Z0-9_-]/g, '_');
    const pdfButtons = document.querySelectorAll('.legal-floating-pdf-btn');

    pdfButtons.forEach(function(btn) {
      btn.onclick = function(e) {
        e.preventDefault();
        const originalTitle = document.title;
        try {
          document.title = "ABCD_Campus_" + docTitle + "_Official.pdf";
        } catch(err) {}

        if (window.playABCDSound) window.playABCDSound('button');

        // Pure client-side browser print/PDF generation - NO network or server saving
        window.print();

        setTimeout(function() {
          try {
            document.title = originalTitle;
          } catch(err) {}
        }, 1200);
      };
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupPdfPrintFilename);
  } else {
    setupPdfPrintFilename();
  }
})();
</script>
