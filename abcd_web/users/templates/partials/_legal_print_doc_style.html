<script>
(function() {
  // Move watermark to body so no wrapper styles or parents offset it in print mode
  function ensureWatermarkInBody() {
    const wm = document.querySelector('.legal-print-watermark');
    if (wm && wm.parentElement !== document.body) {
      document.body.prepend(wm);
    }
  }

  // Active theme management during printing:
  // Temporarily strips dark-theme class before print, restoring it after dialog closes
  let wasDarkTheme = false;
  let originalEarlyThemeContent = null;

  function prepareDocumentForPrint() {
    ensureWatermarkInBody();
    const docEl = document.documentElement;
    const bodyEl = document.body;
    wasDarkTheme = docEl.classList.contains('dark-theme') || (bodyEl && bodyEl.classList.contains('dark-theme'));

    if (wasDarkTheme) {
      docEl.classList.remove('dark-theme');
      docEl.setAttribute('data-theme', 'light');
      if (bodyEl) {
        bodyEl.classList.remove('dark-theme');
        bodyEl.setAttribute('data-theme', 'light');
      }
      const earlyStyle = document.getElementById('abcd-early-theme-style');
      if (earlyStyle) {
        originalEarlyThemeContent = earlyStyle.textContent;
        earlyStyle.textContent = 'html, body { background-color: #faf6ee !important; color-scheme: light !important; }';
      }
    }
  }

  function restoreDocumentAfterPrint() {
    if (wasDarkTheme) {
      const docEl = document.documentElement;
      const bodyEl = document.body;
      docEl.classList.add('dark-theme');
      docEl.setAttribute('data-theme', 'dark');
      if (bodyEl) {
        bodyEl.classList.add('dark-theme');
        bodyEl.setAttribute('data-theme', 'dark');
      }
      const earlyStyle = document.getElementById('abcd-early-theme-style');
      if (earlyStyle && originalEarlyThemeContent !== null) {
        earlyStyle.textContent = originalEarlyThemeContent;
      }
      wasDarkTheme = false;
    }
  }

  window.addEventListener('beforeprint', prepareDocumentForPrint);
  window.addEventListener('afterprint', restoreDocumentAfterPrint);

  // Enhance Print Button & PDF Filename (Local Client-Side Only - 0 bytes saved on server/db)
  function setupPdfPrintFilename() {
    const docTitle = "{{ doc_title|default:'Legal_Document' }}".replace(/[^a-zA-Z0-9_-]/g, '_');
    const pdfButtons = document.querySelectorAll('.legal-floating-pdf-btn');

    pdfButtons.forEach(function(btn) {
      btn.onclick = function(e) {
        e.preventDefault();
        prepareDocumentForPrint();

        const originalTitle = document.title;
        try {
          document.title = "ABCD_Campus_" + docTitle + "_Official.pdf";
        } catch(err) {}

        if (window.playABCDSound) window.playABCDSound('button');

        // Pure client-side browser print/PDF generation - NO network or server saving
        window.print();

        setTimeout(function() {
          try {
            document.title = originalTitle;
          } catch(err) {}
          restoreDocumentAfterPrint();
        }, 1500);
      };
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      ensureWatermarkInBody();
      setupPdfPrintFilename();
    });
  } else {
    ensureWatermarkInBody();
    setupPdfPrintFilename();
  }
})();
</script>
