<!-- WhatsApp-Style Fullscreen Photo Broad View Modal with Anti-Screenshot Protection for Mobile & Desktop -->
<style>

    #photoBroadView, #broadViewImg, #broadViewCanvas, .photo-broad-viewport, .cv-photo, .photo-frame img {
        display: none !important;

}
.photo-broad-protected {
    -webkit-touch-callout: none !important;

    -webkit-user-drag: none !important;

    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);

<div id="photoBroadView" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index: 3000010; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); user-select: none; -webkit-user-select: none; touch-action: none;" onclick="closePhotoView()">
    <div style="position: fixed; top: 20px; right: 20px; z-index: 3000020;">
        <button type="button" onclick="closePhotoView()" aria-label="Close photo preview" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: white; font-size: 2rem; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            <i class='bx bx-x'></i>
        </button>
    </div>
    
    <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 25px;" onclick="event.stopPropagation()">
        <div id="photoBroadViewport" class="photo-broad-viewport" style="position: relative; max-width: 90vw; max-height: 85vh; display: inline-flex; align-items: center; justify-content: center; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 70px rgba(0,0,0,0.65); border: 2px solid rgba(255,255,255,0.15); background: #0b0f19;">
            
            <!-- 1. The Canvas for protected rendering -->
            <canvas id="broadViewCanvas" style="display: none; max-width: 90vw; max-height: 85vh; border-radius: 20px; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-select: none;"></canvas>

            <!-- 2. The standard Image fallback / owner view -->
            <img id="broadViewImg" src="" draggable="false" oncontextmenu="return false;" style="max-width: 90vw; max-height: 85vh; border-radius: 20px; object-fit: contain; display: block; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: filter 0.15s ease, opacity 0.15s ease;">
            
            <!-- 3. Dynamic Live Security Watermark (for non-owners) - Discreet pill at bottom, not covering face -->
            <div id="photoWatermark" class="photo-security-watermark-pattern" style="display: none;">
                <div class="photo-watermark-text" id="watermarkStamp">
                    🛡️ <span id="watermarkLiveMeta"></span>
                </div>
            </div>

            <!-- 4. Touch & Hold Privacy Curtain (Mobile & Desktop Anti-Screenshot Barrier) -->
            <div id="photoHoldCurtain" style="display: none; position: absolute; inset: 0; z-index: 18; background: rgba(15, 23, 42, 0.94); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 25px; border-radius: 20px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;">
                <div class="hold-fingerprint-ring">
                    <i class='bx bx-fingerprint' style="font-size: 3rem; color: #a5b4fc;"></i>
                </div>
                <div style="font-size: 1.2rem; font-weight: 800; color: #ffffff; letter-spacing: 0.5px;">Press & Hold to View</div>
                <div style="font-size: 0.84rem; color: #94a3b8; max-width: 250px; line-height: 1.45;">
                    🛡️ <strong style="color: #cbd5e1;">Protected Profile Photo</strong><br>
                    <span style="color: #64748b; font-size: 0.76rem;">Releasing, capturing, or shortcut keys conceal the photo instantly</span>
                </div>
            </div>

            <!-- 5. Transparent Touch/Hold Interceptor Layer -->
            <div id="photoShieldOverlay" style="position: absolute; inset: 0; z-index: 22; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: none;" oncontextmenu="return false;" ondragstart="return false;"></div>

            <!-- 6. Anti-Capture Blackout Veil (Active when Snipping Tool, Win+Shift+S, Cmd+Shift, Multi-Touch or Gestures are detected) -->
            <div id="photoBlackoutVeil" style="display: none; position: absolute; inset: 0; z-index: 28; background: #0b0f19; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #cbd5e1; text-align: center; padding: 25px; pointer-events: none;">
                <i class='bx bxs-shield-x' style="font-size: 3.2rem; color: #f43f5e; filter: drop-shadow(0 4px 12px rgba(244,63,94,0.4));"></i>
                <span id="blackoutVeilTitle" style="font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: 0.5px;">Screenshot Restricted</span>
                <small id="blackoutVeilDesc" style="font-size: 0.85rem; color: #94a3b8; max-width: 260px; line-height: 1.4;">Profile photos of other members cannot be captured or copied.</small>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    let activeProtectedModalOpen = false;
    let currentPhotoIsOwner = false;
    let isHoldingActive = false;
    let veilRestoreTimer = null;
    let watermarkClockTimer = null;
    let maxHoldTimeoutTimer = null;
    let touchStartX = 0;
    let touchStartY = 0;

    const MAX_CONTINUOUS_HOLD_MS = 5000; // 5-second anti-screen recording limit
    const viewerIdentifier = "{{ request.user.username|default:'VISITOR'|escapejs }}".toUpperCase();

    // Intercept in-browser screen sharing / recording API
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            navigator.mediaDevices.getDisplayMedia = function() {
                if (activeProtectedModalOpen && !currentPhotoIsOwner) {
                    triggerBlackoutVeil('Capture Blocked', 'Screen recording and capture tools are strictly restricted.');
                }
                return Promise.reject(new DOMException('Screen recording is restricted.', 'NotAllowedError'));
            };
        }
    } catch (_) {}

    function updateWatermarkTime() {
        const metaSpan = document.getElementById('watermarkLiveMeta');
        if (metaSpan) {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            metaSpan.textContent = `ABCD SECURE • ${viewerIdentifier} • ${timeStr}`;
        }
    }

    function triggerBlackoutVeil(title, desc) {
        concealPhotoImmediately();
        const veil = document.getElementById('photoBlackoutVeil');
        const vTitle = document.getElementById('blackoutVeilTitle');
        const vDesc = document.getElementById('blackoutVeilDesc');
        if (veil) {
            if (title && vTitle) vTitle.textContent = title;
            if (desc && vDesc) vDesc.textContent = desc;
            veil.style.display = 'flex';
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try { navigator.clipboard.writeText(''); } catch (_) {}
        }
    }

    function liftBlackoutVeil() {
        if (veilRestoreTimer) clearTimeout(veilRestoreTimer);
        veilRestoreTimer = setTimeout(() => {
            const modal = document.getElementById('photoBroadView');
            if (modal && modal.style.display !== 'none' && document.hasFocus() && !document.hidden) {
                const veil = document.getElementById('photoBlackoutVeil');
                if (veil) veil.style.display = 'none';
                if (!currentPhotoIsOwner) {
                    showCurtainPrompt();
                }
            }
        }, 320);
    }

    function revealPhotoOnHold() {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
        if (isHoldingActive) return;
        isHoldingActive = true;

        const curtain = document.getElementById('photoHoldCurtain');
        const broadImg = document.getElementById('broadViewImg');
        const broadCanvas = document.getElementById('broadViewCanvas');
        const watermark = document.getElementById('photoWatermark');

        if (curtain) {
            curtain.style.opacity = '0';
            curtain.style.visibility = 'hidden';
        }
        if (broadCanvas && broadCanvas.dataset.rendered === 'true') {
            broadCanvas.style.opacity = '1';
            broadCanvas.style.filter = 'none';
        } else if (broadImg) {
            broadImg.style.opacity = '1';
            broadImg.style.filter = 'none';
        }
        if (watermark) watermark.style.display = 'flex';

        updateWatermarkTime();
        if (watermarkClockTimer) clearInterval(watermarkClockTimer);
        watermarkClockTimer = setInterval(updateWatermarkTime, 1000);

        // Anti-Screen Recording: Enforce 5-second maximum continuous viewing window
        if (maxHoldTimeoutTimer) clearTimeout(maxHoldTimeoutTimer);
        maxHoldTimeoutTimer = setTimeout(() => {
            if (isHoldingActive && activeProtectedModalOpen && !currentPhotoIsOwner) {
                concealPhotoImmediately();
                triggerBlackoutVeil('Viewing Timeout', 'Continuous viewing is limited to 5 seconds to prevent recording. Release and hold again.');
                setTimeout(liftBlackoutVeil, 2200);
            }
        }, MAX_CONTINUOUS_HOLD_MS);
    }

    function concealPhotoImmediately() {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
        isHoldingActive = false;

        if (maxHoldTimeoutTimer) {
            clearTimeout(maxHoldTimeoutTimer);
            maxHoldTimeoutTimer = null;
        }
        if (watermarkClockTimer) {
            clearInterval(watermarkClockTimer);
            watermarkClockTimer = null;
        }

        const curtain = document.getElementById('photoHoldCurtain');
        const broadImg = document.getElementById('broadViewImg');
        const broadCanvas = document.getElementById('broadViewCanvas');
        const watermark = document.getElementById('photoWatermark');

        if (curtain) {
            curtain.style.opacity = '1';
            curtain.style.visibility = 'visible';
        }
        if (broadImg) {
            broadImg.style.opacity = '0';
            broadImg.style.filter = 'blur(45px)';
        }
        if (broadCanvas) {
            broadCanvas.style.opacity = '0';
            broadCanvas.style.filter = 'blur(45px)';
        }
        if (watermark) watermark.style.display = 'none';
    }

    function showCurtainPrompt() {
        const curtain = document.getElementById('photoHoldCurtain');
        const shield = document.getElementById('photoShieldOverlay');
        const broadImg = document.getElementById('broadViewImg');
        const broadCanvas = document.getElementById('broadViewCanvas');
        const watermark = document.getElementById('photoWatermark');

        if (curtain) {
            curtain.style.display = 'flex';
            curtain.style.opacity = '1';
            curtain.style.visibility = 'visible';
        }
        if (shield) shield.style.display = 'block';
        if (broadImg) {
            broadImg.style.opacity = '0';
            broadImg.style.filter = 'blur(45px)';
        }
        if (broadCanvas) {
            broadCanvas.style.opacity = '0';
            broadCanvas.style.filter = 'blur(45px)';
        }
        if (watermark) watermark.style.display = 'none';
    }

    // Global Capture-Phase Window Multi-Touch Interceptor (Defeats 3-finger swipe anywhere on screen)
    function onGlobalWindowTouch(e) {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
        if (e.touches && e.touches.length > 1) {
            try {
                e.preventDefault();
                e.stopImmediatePropagation();
            } catch (_) {}
            triggerBlackoutVeil('Multi-Touch Blocked', 'Multi-finger screenshot gestures (such as 3-finger swipe) are strictly restricted.');
            setTimeout(liftBlackoutVeil, 2200);
        }
    }

    // Local Touch Event Traps for Photo Viewing (press & hold, movement threshold)
    function onTouchStart(e) {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;

        if (e.touches && e.touches.length > 1) {
            try {
                e.preventDefault();
                e.stopImmediatePropagation();
            } catch (_) {}
            triggerBlackoutVeil('Multi-Touch Blocked', 'Multi-finger screenshot gestures are strictly restricted.');
            setTimeout(liftBlackoutVeil, 2200);
            return;
        }

        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        revealPhotoOnHold();
    }

    function onTouchMove(e) {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;

        if (e.touches && e.touches.length > 1) {
            try {
                e.preventDefault();
                e.stopImmediatePropagation();
            } catch (_) {}
            triggerBlackoutVeil('Gesture Blocked', 'Screenshot gesture detected and concealed.');
            setTimeout(liftBlackoutVeil, 2200);
            return;
        }

        if (!isHoldingActive) return;

        // If finger moves more than 20px (swiping screenshot, palm swipe, or notification bar pull-down):
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const dist = Math.hypot(currentX - touchStartX, currentY - touchStartY);
        if (dist > 20) {
            concealPhotoImmediately();
        }
    }

    function onTouchEnd(e) {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
        concealPhotoImmediately();
    }

    function onTouchCancel(e) {
        // Physical side buttons (Power+Volume) trigger touchcancel on mobile OS:
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
        concealPhotoImmediately();
        triggerBlackoutVeil('Capture Restricted', 'Hardware capture interrupts viewing session.');
        setTimeout(liftBlackoutVeil, 2000);
    }

    function onPointerCancel(e) {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
        concealPhotoImmediately();
        triggerBlackoutVeil('Capture Restricted', 'Pointer interrupted.');
        setTimeout(liftBlackoutVeil, 2000);
    }

    // Desktop Mouse Pointer Support (Click & Hold to view)
    function onPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button === 0) {
            revealPhotoOnHold();
        }
    }

    function onPointerUp(e) {
        if (e.pointerType === 'mouse') {
            concealPhotoImmediately();
        }
    }

    function onPointerLeave(e) {
        if (e.pointerType === 'mouse') {
            concealPhotoImmediately();
        }
    }

    // Window focus loss (Alt+Tab, Snipping tool Win+Shift+S, Mac Grab, Android assistant, Notification Shade)
    function handleBlur() {
        if (activeProtectedModalOpen && !currentPhotoIsOwner) {
            triggerBlackoutVeil('Window Inactive', 'Screenshot or window switch detected.');
        }
    }

    function handleFocus() {
        if (activeProtectedModalOpen && !currentPhotoIsOwner) {
            liftBlackoutVeil();
        }
    }

    function handleVisibility() {
        if (activeProtectedModalOpen && !currentPhotoIsOwner) {
            if (document.hidden) {
                triggerBlackoutVeil('Screen Concealed', 'Display was hidden or captured.');
            } else {
                liftBlackoutVeil();
            }
        }
    }

    function handleResize() {
        if (activeProtectedModalOpen && !currentPhotoIsOwner && isHoldingActive) {
            triggerBlackoutVeil('Display Changed', 'Screen dimension change detected.');
            setTimeout(liftBlackoutVeil, 2000);
        }
    }

    // Hardware Keyboard & Shortcut Traps (Win+Shift+S, Cmd+Shift+3/4/5, PrintScreen, etc.)
    function handleKey(e) {
        if (!activeProtectedModalOpen || currentPhotoIsOwner) return;

        const key = e.key || '';
        const code = e.code || '';
        const isPrtScn = (key === 'PrintScreen' || code === 'PrintScreen' || e.keyCode === 44);

        // Windows key (Meta) or Mac Command key (Meta):
        // Any press of Meta key alone or in combo indicates OS action or screenshot (Win+Shift+S, Cmd+Shift+3/4/5, Win+PrtScn)
        const isMetaKey = (key === 'Meta' || code === 'MetaLeft' || code === 'MetaRight' || e.metaKey);

        // Multi-key screenshot shortcuts:
        // Windows: Win+Shift+S, Win+PrtScn, Win+Alt+PrtScn
        // Mac: Cmd+Shift+3, Cmd+Shift+4, Cmd+Shift+5, Cmd+Shift+6
        // Linux/Browsers: Ctrl+Shift+S, Ctrl+PrtScn
        const isShiftCombo = e.shiftKey && (e.metaKey || e.ctrlKey || e.altKey);
        const isSnipDigit = (key >= '3' && key <= '6') || (code >= 'Digit3' && code <= 'Digit6');
        const isSnipChar = (key === 's' || key === 'S' || code === 'KeyS');
        const isCaptureCombo = (e.metaKey || e.ctrlKey) && (isShiftCombo || isSnipDigit || isSnipChar);

        // Save, Print, Source inspection
        const isPrintCombo = (e.ctrlKey || e.metaKey) && (key === 'p' || key === 'P' || code === 'KeyP');
        const isSaveCombo = (e.ctrlKey || e.metaKey) && (key === 's' || key === 'S' || code === 'KeyS');
        const isInspectCombo = (key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'I' || key === 'c' || key === 'C' || key === 'j' || key === 'J')));

        if (isPrtScn || isMetaKey || isShiftCombo || isCaptureCombo || isPrintCombo || isSaveCombo || isInspectCombo) {
            try {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            } catch (_) {}

            concealPhotoImmediately();
            triggerBlackoutVeil('Screenshot Blocked', 'Capture shortcuts (Win+Shift+S, Cmd+Shift, PrtScn) are strictly restricted.');
            setTimeout(liftBlackoutVeil, 2000);

            if (navigator.clipboard && navigator.clipboard.writeText) {
                try { navigator.clipboard.writeText(''); } catch (_) {}
            }
            return false;
        }
    }

    function handleBeforePrint() {
        if (activeProtectedModalOpen && !currentPhotoIsOwner) {
            window.closePhotoView();
        }
    }

    function handleCopy(e) {
        if (activeProtectedModalOpen && !currentPhotoIsOwner) {
            try {
                e.preventDefault();
                if (e.clipboardData) e.clipboardData.setData('text/plain', '');
            } catch (_) {}
            triggerBlackoutVeil('Copy Restricted', 'Content copying is restricted.');
        }
    }

    function armProtection() {
        const shield = document.getElementById('photoShieldOverlay');
        const curtain = document.getElementById('photoHoldCurtain');

        // Global capture phase multi-touch prevention across whole window
        window.addEventListener('touchstart', onGlobalWindowTouch, { passive: false, capture: true });
        window.addEventListener('touchmove', onGlobalWindowTouch, { passive: false, capture: true });

        if (shield) {
            shield.addEventListener('touchstart', onTouchStart, { passive: false });
            shield.addEventListener('touchmove', onTouchMove, { passive: false });
            shield.addEventListener('touchend', onTouchEnd, { passive: true });
            shield.addEventListener('touchcancel', onTouchCancel, { passive: true });
            shield.addEventListener('pointerdown', onPointerDown);
            shield.addEventListener('pointerup', onPointerUp);
            shield.addEventListener('pointerleave', onPointerLeave);
            shield.addEventListener('pointercancel', onPointerCancel);
        }
        if (curtain) {
            curtain.addEventListener('touchstart', onTouchStart, { passive: false });
            curtain.addEventListener('touchmove', onTouchMove, { passive: false });
            curtain.addEventListener('touchend', onTouchEnd, { passive: true });
            curtain.addEventListener('touchcancel', onTouchCancel, { passive: true });
            curtain.addEventListener('pointerdown', onPointerDown);
            curtain.addEventListener('pointerup', onPointerUp);
            curtain.addEventListener('pointerleave', onPointerLeave);
            curtain.addEventListener('pointercancel', onPointerCancel);
        }

        window.addEventListener('blur', handleBlur);
        window.addEventListener('focus', handleFocus);
        document.addEventListener('visibilitychange', handleVisibility);
        window.addEventListener('resize', handleResize);
        window.addEventListener('keydown', handleKey, true);
        window.addEventListener('keyup', handleKey, true);
        window.addEventListener('copy', handleCopy, true);
        window.addEventListener('beforeprint', handleBeforePrint);
    }

    function disarmProtection() {
        window.removeEventListener('touchstart', onGlobalWindowTouch, { capture: true });
        window.removeEventListener('touchmove', onGlobalWindowTouch, { capture: true });

        const shield = document.getElementById('photoShieldOverlay');
        const curtain = document.getElementById('photoHoldCurtain');

        if (shield) {
            shield.removeEventListener('touchstart', onTouchStart);
            shield.removeEventListener('touchmove', onTouchMove);
            shield.removeEventListener('touchend', onTouchEnd);
            shield.removeEventListener('touchcancel', onTouchCancel);
            shield.removeEventListener('pointerdown', onPointerDown);
            shield.removeEventListener('pointerup', onPointerUp);
            shield.removeEventListener('pointerleave', onPointerLeave);
            shield.removeEventListener('pointercancel', onPointerCancel);
        }
        if (curtain) {
            curtain.removeEventListener('touchstart', onTouchStart);
            curtain.removeEventListener('touchmove', onTouchMove);
            curtain.removeEventListener('touchend', onTouchEnd);
            curtain.removeEventListener('touchcancel', onTouchCancel);
            curtain.removeEventListener('pointerdown', onPointerDown);
            curtain.removeEventListener('pointerup', onPointerUp);
            curtain.removeEventListener('pointerleave', onPointerLeave);
            curtain.removeEventListener('pointercancel', onPointerCancel);
        }

        window.removeEventListener('blur', handleBlur);
        window.removeEventListener('focus', handleFocus);
        document.removeEventListener('visibilitychange', handleVisibility);
        window.removeEventListener('resize', handleResize);
        window.removeEventListener('keydown', handleKey, true);
        window.removeEventListener('keyup', handleKey, true);
        window.removeEventListener('copy', handleCopy, true);
        window.removeEventListener('beforeprint', handleBeforePrint);

        if (maxHoldTimeoutTimer) {
            clearTimeout(maxHoldTimeoutTimer);
            maxHoldTimeoutTimer = null;
        }
        if (watermarkClockTimer) {
            clearInterval(watermarkClockTimer);
            watermarkClockTimer = null;
        }

        const veil = document.getElementById('photoBlackoutVeil');
        const broadImg = document.getElementById('broadViewImg');
        const broadCanvas = document.getElementById('broadViewCanvas');
        if (veil) veil.style.display = 'none';
        if (broadImg) {
            broadImg.style.opacity = '1';
            broadImg.style.filter = 'none';
        }
        if (broadCanvas) {
            broadCanvas.style.opacity = '1';
            broadCanvas.style.filter = 'none';
        }
    }

    window.openProtectedPhotoView = function(imageSrc, isOwner) {
        if (!imageSrc) return;
        currentPhotoIsOwner = !!isOwner;
        activeProtectedModalOpen = true;
        isHoldingActive = false;

        const modal = document.getElementById('photoBroadView');
        const broadImg = document.getElementById('broadViewImg');
        const broadCanvas = document.getElementById('broadViewCanvas');
        const shield = document.getElementById('photoShieldOverlay');
        const curtain = document.getElementById('photoHoldCurtain');
        const watermark = document.getElementById('photoWatermark');
        const veil = document.getElementById('photoBlackoutVeil');

        if (!modal || !broadImg) return;

        if (currentPhotoIsOwner) {
            // Owner viewing their own photo: fully unrestricted
            disarmProtection();
            if (broadCanvas) broadCanvas.style.display = 'none';
            if (shield) shield.style.display = 'none';
            if (curtain) curtain.style.display = 'none';
            if (watermark) watermark.style.display = 'none';
            if (veil) veil.style.display = 'none';

            broadImg.src = imageSrc;
            broadImg.style.display = 'block';
            broadImg.style.opacity = '1';
            broadImg.style.filter = 'none';
            broadImg.classList.remove('photo-broad-protected');
            modal.style.display = 'flex';
        } else {
            // Other user viewing: multi-layered anti-screenshot protection
            armProtection();
            showCurtainPrompt();

            broadImg.classList.add('photo-broad-protected');
            broadImg.src = imageSrc;
            broadImg.style.display = 'block';

            // Clean pixel rendering into canvas memory without marks on face
            if (broadCanvas) {
                broadCanvas.dataset.rendered = 'false';
                const tempImg = new Image();
                tempImg.crossOrigin = 'anonymous';
                tempImg.onload = function() {
                    if (!activeProtectedModalOpen || currentPhotoIsOwner) return;
                    const maxW = Math.min(window.innerWidth * 0.9, 900);
                    const maxH = Math.min(window.innerHeight * 0.85, 900);
                    const w = tempImg.naturalWidth || 600;
                    const h = tempImg.naturalHeight || 600;
                    const ratio = Math.min(maxW / w, maxH / h, 1);
                    broadCanvas.width = Math.round(w * ratio);
                    broadCanvas.height = Math.round(h * ratio);

                    const ctx = broadCanvas.getContext('2d');
                    ctx.drawImage(tempImg, 0, 0, broadCanvas.width, broadCanvas.height);

                    // Block programmatic extraction methods on canvas
                    try {
                        broadCanvas.toDataURL = function() { return ''; };
                        broadCanvas.toBlob = function(cb) { if (typeof cb === 'function') cb(null); };
                    } catch (_) {}

                    broadCanvas.dataset.rendered = 'true';
                    broadCanvas.style.display = 'block';
                    broadCanvas.style.opacity = '0';
                    broadCanvas.style.filter = 'blur(45px)';
                    broadCanvas.classList.add('photo-broad-protected');
                    broadImg.style.display = 'none';
                };
                tempImg.onerror = function() {
                    // CORS fallback: protected broadImg remains displayed under shield
                    broadImg.style.display = 'block';
                    broadCanvas.style.display = 'none';
                };
                tempImg.src = imageSrc;
            }

            modal.style.display = 'flex';
        }
    };

    window.closePhotoView = function() {
        const modal = document.getElementById('photoBroadView');
        if (modal) modal.style.display = 'none';
        activeProtectedModalOpen = false;
        isHoldingActive = false;
        disarmProtection();
    };

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && activeProtectedModalOpen) {
            window.closePhotoView();
        }
    });
})();
</script>
