<style>
  /* --- MASTER LOADER OVERLAY STYLE --- */
  .master-loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #111a2e 0%, #080d1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* --- LIGHT THEME STYLE OVERRIDES --- */
  .master-loader-overlay.light-theme {
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
  }

  .master-loader-overlay.light-theme .loader-brand {
      color: #1e293b;
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.15);
  }

  .master-loader-overlay.light-theme .loader-subtitle {
      color: #4f46e5;
  }

  .master-loader-overlay.light-theme .loader-status-text {
      color: #475569;
  }

  .master-loader-overlay.light-theme .circle-core {
      background-color: #f1f5f9;
  }

  .master-loader-overlay.light-theme .glowing-bg {
      fill: rgba(99, 102, 241, 0.02);
      stroke: rgba(99, 102, 241, 0.1);
  }

  .master-loader-overlay.light-theme .loader-progress-bar {
      background: rgba(0, 0, 0, 0.05);
  }

  .master-loader-overlay.light-theme .orbit-ring-1 {
      stroke: rgba(139, 92, 246, 0.25);
  }

  .master-loader-overlay.light-theme .orbit-ring-2 {
      stroke: rgba(168, 85, 247, 0.2);
  }

  .master-loader-overlay.fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
  }

  .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 450px;
  }

  /* Mascot SVG Styling & Animations */
  .mascot-wrapper {
      width: clamp(140px, 25vw, 240px);
      height: clamp(140px, 25vw, 240px);
      margin-bottom: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
  }

  .abcd-mascot-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
  }

  /* Base Mascot SVG Elements Colors */
  .glowing-bg {
      fill: rgba(99, 102, 241, 0.05);
      stroke: rgba(99, 102, 241, 0.15);
      stroke-width: 1.5;
  }

  .orbit-ring {
      fill: none;
      stroke-width: 1.5;
      transform-origin: 100px 100px;
  }

  .orbit-ring-1 {
      stroke: rgba(139, 92, 246, 0.4);
      animation: loaderOrbitRing 8s linear infinite;
  }

  .orbit-ring-2 {
      stroke: rgba(168, 85, 247, 0.3);
      animation: loaderOrbitRingInverse 12s linear infinite;
  }

  .book-cover {
      fill: #4c1d95;
      stroke: #6d28d9;
      stroke-width: 1.5;
  }

  .book-page {
      fill: #ffffff;
      stroke: #e2e8f0;
      stroke-width: 1;
  }

  .owl-body {
      fill: #3b82f6;
      animation: loaderHoverOwl 3s ease-in-out infinite alternate;
      transform-origin: 100px 105px;
  }

  .owl-belly {
      fill: #eff6ff;
  }

  .owl-feather {
      fill: #1d4ed8;
  }

  .owl-eye-white {
      fill: #ffffff;
  }

  .owl-eye-pupil {
      fill: #1e293b;
  }

  .owl-eye-shine {
      fill: #ffffff;
  }

  .glasses-frame {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 2.5;
  }

  .glasses-bridge {
      stroke: #f59e0b;
      stroke-width: 3;
  }

  .owl-beak {
      fill: #f59e0b;
  }

  .owl-wing {
      fill: #2563eb;
      transform-origin: 100px 105px;
  }

  .left-wing {
      animation: loaderWingFlapLeft 3s ease-in-out infinite alternate;
  }

  .right-wing {
      animation: loaderWingFlapRight 3s ease-in-out infinite alternate;
  }

  .cap-top {
      fill: #1e293b;
      stroke: #475569;
      stroke-width: 1;
  }

  .cap-base {
      fill: #0f172a;
  }

  .cap-tassel {
      stroke: #f59e0b;
      stroke-width: 1.5;
      fill: none;
  }

  .cap-tassel-end {
      fill: #f59e0b;
  }

  .sparkle {
      fill: #fcd34d;
      opacity: 0.8;
  }

  .sparkle-1 {
      animation: loaderPulseGlow 1.5s ease-in-out infinite alternate;
  }

  .sparkle-2 {
      animation: loaderPulseGlow 1.5s ease-in-out infinite alternate-reverse;
  }

  /* Animations */
  @keyframes loaderHoverOwl {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
  }

  @keyframes loaderWingFlapLeft {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-6deg); }
  }

  @keyframes loaderWingFlapRight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(6deg); }
  }

  @keyframes loaderOrbitRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
  }

  @keyframes loaderOrbitRingInverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
  }

  @keyframes loaderPulseGlow {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
  }

  /* Spinner Box */
  .spinner-box {
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      margin-bottom: 20px;
  }

  .circle-border {
      width: 40px;
      height: 40px;
      padding: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: linear-gradient(0deg, rgba(99, 102, 241, 0.1) 33%, rgba(99, 102, 241, 1) 100%);
      animation: loaderSpin 0.8s linear infinite;
  }

  .circle-core {
      width: 100%;
      height: 100%;
      background-color: #080d1a;
      border-radius: 50%;
  }

  .master-loader-overlay.light-theme .circle-core {
      background-color: #f1f5f9;
  }

  @keyframes loaderSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
  }

  /* Brand Typography Styles */
  .loader-brand {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin: 5px 0;
      font-family: 'Righteous', sans-serif, system-ui;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
  }

  .loader-subtitle {
      color: #7b61ff;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
  }

  .loader-progress-bar {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
  }

  .loader-progress-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #7b61ff, #a855f7);
      border-radius: 10px;
      animation: loaderProgressInfinite 1.8s ease-in-out infinite;
      transform-origin: left;
  }

  @keyframes loaderProgressInfinite {
      0% { transform: scaleX(0) translateX(0); }
      50% { transform: scaleX(0.55) translateX(55%); }
      100% { transform: scaleX(0) translateX(190%); }
  }

  .loader-status-text {
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      animation: loaderPulseOpacity 1.2s infinite alternate;
  }

  @keyframes loaderPulseOpacity {
      0% { opacity: 0.45; }
      100% { opacity: 1; }
  }

  /* --- ERROR / OFFLINE BOX STYLE --- */
  .loader-error-box {
      display: none;
      margin-top: 15px;
      padding: 16px 24px;
      border-radius: 16px;
      background: rgba(239, 68, 68, 0.07);
      border: 1.5px solid rgba(239, 68, 68, 0.2);
      max-width: 380px;
      width: calc(100% - 20px);
      box-sizing: border-box;
      animation: loaderSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes loaderSlideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
  }

  .loader-error-title {
      color: #ef4444;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
  }

  .loader-error-desc {
      color: #94a3b8;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 15px;
  }

  .master-loader-overlay.light-theme .loader-error-desc {
      color: #475569;
  }

  .loader-btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
  }

  .loader-btn {
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      outline: none;
  }

  .loader-btn-retry {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
  }

  .loader-btn-retry:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
  }

  .loader-btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .loader-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.15);
  }

  .master-loader-overlay.light-theme .loader-btn-cancel {
      background: rgba(0, 0, 0, 0.05);
      color: #1e293b;
      border: 1px solid rgba(0, 0, 0, 0.1);
  }

  .master-loader-overlay.light-theme .loader-btn-cancel:hover {
      background: rgba(0, 0, 0, 0.08);
  }

  /* ==========================================================================
     GLOBAL MEDIA LIGHTBOX (PREVIEW MODAL FOR PHOTOS & ATTACHMENTS)
     ========================================================================== */
  .abcd-lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(8, 13, 26, 0.88);

      z-index: 10000000;

      flex-direction: column;

      user-select: none;
      touch-action: none;
  }

  .abcd-lightbox-overlay.active {

      visibility: visible;
      pointer-events: auto;
  }

  .abcd-lb-topbar {

      align-items: center;

  .abcd-lb-title-wrap {

  }

  .abcd-lb-badge {

      font-size: 0.75rem;
      font-weight: 700;

  }

  .abcd-lb-actions {
      display: flex;

  }

  .abcd-lb-btn {
      width: 40px;

  .abcd-lb-btn:hover {
      background: rgba(255, 255, 255, 0.22);

  }

  .abcd-lb-btn:active {
      transform: scale(0.95);
  }

  .abcd-lb-btn-close {
      background: rgba(239, 68, 68, 0.2);

      color: #fca5a5;
  }

  .abcd-lb-btn-close:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
  }

  .abcd-lb-body {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px;
  }

  .abcd-lb-viewport {
      position: relative;
      max-width: 95vw;
      max-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
  }

  .abcd-lb-viewport.grabbing {
      cursor: grabbing;
  }

  .abcd-lb-img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
  }

  .abcd-lb-spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: loaderSpin 0.7s linear infinite;
      display: none;
  }

  .abcd-lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      height: 46px;
      border-radius: 50%;

      color: #fff;

      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      cursor: pointer;

  .abcd-lb-nav-btn:hover {

      transform: translateY(-50%) scale(1.08);

  .abcd-lb-prev {

  }

  .abcd-lb-bottombar {

  .abcd-lb-dot.active {

      border-radius: 10px;

  @media (max-width: 640px) {

          font-size: 1.1rem;
      }
      .abcd-lb-nav-btn {
          width: 38px;
          height: 38px;
          font-size: 1.4rem;
      }
      .abcd-lb-prev { left: 10px; }
      .abcd-lb-next { right: 10px; }
  }
</style>

  <div class="abcd-lb-body" id="abcd-lb-body">
    <button type="button" class="abcd-lb-nav-btn abcd-lb-prev" id="abcd-lb-prev" title="Previous (Left Arrow)" aria-label="Previous">
      <i class='bx bx-chevron-left'></i>
    </button>
    <div class="abcd-lb-viewport" id="abcd-lb-viewport">
      <div class="abcd-lb-spinner" id="abcd-lb-spinner"></div>
      <img id="abcd-lb-img" class="abcd-lb-img" src="" alt="Media preview" draggable="false" />
    </div>
    <button type="button" class="abcd-lb-nav-btn abcd-lb-next" id="abcd-lb-next" title="Next (Right Arrow)" aria-label="Next">
      <i class='bx bx-chevron-right'></i>
    </button>
  </div>

  <div class="abcd-lb-bottombar" id="abcd-lb-dots"></div>
</div>

<script>
  (function() {
      // ----------------------------------------------------------------------
      // 1. MASTER LOADER ENGINE & INTENT INTERCEPTION SAFEGUARDS
      // ----------------------------------------------------------------------
      const loader = document.getElementById('master-loader');
      if (!loader) return;

      const phrases = [
          "Loading Excellence...",
          "Preparing your dashboard...",
          "Setting up the desk...",
          "Aligning the books...",
          "Unlocking potential..."
      ];
      
      const statusMsg = document.getElementById('loader-status-msg');
      if (statusMsg) {
          statusMsg.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      }

      let watchdogTimer = null;
      let showDebounceTimer = null;
      window.__isHandlingExternalIntent = false;
      window.__isLightboxOpen = false;

      // Hide loader safely
      window.hideMasterLoader = function() {
          clearTimeout(watchdogTimer);
          clearTimeout(showDebounceTimer);
          loader.classList.add('fade-out');
          setTimeout(() => {
              loader.style.display = 'none';
              resetErrorUI();
          }, 180);
      };

      function resetErrorUI() {
          const errorContainer = document.getElementById('loader-error-container');
          const progressBar = document.querySelector('.loader-progress-bar');
          const spinner = document.querySelector('.spinner-box');
          if (errorContainer) errorContainer.style.display = 'none';
          if (statusMsg) statusMsg.style.display = 'block';
          if (progressBar) progressBar.style.display = 'block';
          if (spinner) spinner.style.display = 'flex';
      }

      if (document.readyState === 'interactive' || document.readyState === 'complete') {
          window.hideMasterLoader();
      } else {
          document.addEventListener('DOMContentLoaded', window.hideMasterLoader);
          window.addEventListener('load', window.hideMasterLoader);
      }

      function startWatchdog() {
          clearTimeout(watchdogTimer);
          watchdogTimer = setTimeout(() => {
              if (document.visibilityState === 'visible' && !loader.classList.contains('fade-out')) {
                  showErrorUI("Could Not Load Page", "The page is taking longer than usual to load. Please check your internet connection.");
              }
          }, 25000);
      }

      if (!loader.classList.contains('fade-out')) {
          startWatchdog();
      }

      function showOfflineUI() {
          clearTimeout(watchdogTimer);
          showErrorUI("No Internet Connection", "Your device is offline. Please check your network cables or Wi-Fi settings.");
      }

      function showErrorUI(title, description) {
          const errorContainer = document.getElementById('loader-error-container');
          const progressBar = document.querySelector('.loader-progress-bar');
          const spinner = document.querySelector('.spinner-box');
          
          if (errorContainer) {
              if (spinner) spinner.style.display = 'none';
              if (progressBar) progressBar.style.display = 'none';
              if (statusMsg) statusMsg.style.display = 'none';
              
              const titleEl = document.getElementById('loader-error-title-text');
              const descEl = document.getElementById('loader-error-desc-text');
              if (titleEl) titleEl.textContent = title;
              if (descEl) descEl.textContent = description;
              errorContainer.style.display = 'block';
          }
      }

      if (!navigator.onLine) {
          showOfflineUI();
      }

      window.addEventListener('offline', showOfflineUI);
      window.addEventListener('online', () => {
          resetErrorUI();
          startWatchdog();
      });

      // Crucial: When returning from external apps (WhatsApp, Phone Call, Maps, Mail), instantly dismiss loader!
      window.addEventListener('pageshow', function(event) {
          window.hideMasterLoader();
      });

      window.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
              window.hideMasterLoader();
          }
      });

      window.addEventListener('focus', function() {
          window.hideMasterLoader();
      });

      function triggerLoader() {
          if (window.__isHandlingExternalIntent || window.isDownloadingFile || window.__isLightboxOpen) {
              return;
          }
          clearTimeout(showDebounceTimer);
          showDebounceTimer = setTimeout(() => {
              if (window.__isHandlingExternalIntent || window.isDownloadingFile || window.__isLightboxOpen) {
                  return;
              }
              resetErrorUI();
              loader.style.display = 'flex';
              loader.classList.remove('fade-out');
              startWatchdog();
              if (!navigator.onLine) {
                  showOfflineUI();
              }
          }, 200);
      }

      // Check if a link is an external app intent, phone call, whatsapp, map, or media file
      function isExternalOrSpecialAction(link, href) {
          if (!href) return true;
          const h = href.trim().toLowerCase();

          // 1. External Protocols & Schemes
          if (h.startsWith('#') || 
              h.startsWith('javascript:') || 
              h.startsWith('mailto:') || 
              h.startsWith('tel:') || 
              h.startsWith('sms:') || 
              h.startsWith('whatsapp:') || 
              h.startsWith('geo:') || 
              h.startsWith('intent:') || 
              h.startsWith('market:') || 
              h.startsWith('blob:') || 
              h.startsWith('data:')) {
              return true;
          }

          // 2. WhatsApp & External Messaging Domains
          if (h.includes('wa.me') || h.includes('api.whatsapp.com') || h.includes('web.whatsapp.com')) {
              return true;
          }

          // 3. Maps & Location Domains
          if (h.includes('maps.google.') || h.includes('maps.app.goo.gl') || h.includes('google.com/maps')) {
              return true;
          }

          // 4. Social Media External Domains
          if (h.includes('instagram.com') || h.includes('youtube.com') || h.includes('youtu.be') || h.includes('facebook.com') || h.includes('twitter.com') || h.includes('t.me')) {
              return true;
          }

          // 5. Image & Media File Formats (Handled by Lightbox or direct view)
          if (/\.(jpe?g|png|webp|gif|svg|bmp|pdf|mp4|webm|ogg|mp3|wav)(\?.*)?$/i.test(h) || h.includes('/media/') || h.includes('res.cloudinary.com')) {
              return true;
          }

          // 6. Explicit Attributes / Classes
          if (link.hasAttribute('download') || 
              link.hasAttribute('data-no-loader') || 
              link.hasAttribute('data-preview-media') || 
              link.hasAttribute('data-bs-toggle') || 
              link.classList.contains('complaint-thumb-link') || 
              link.classList.contains('complaint-img-link') || 
              link.classList.contains('abcd-lightbox-trigger') || 
              link.classList.contains('contact-btn') || 
              link.classList.contains('whatsapp') || 
              link.classList.contains('social-pill')) {
              return true;
          }

          // 7. New Tab targets
          if (link.getAttribute('target') === '_blank') {
              return true;
          }

          return false;
      }

      // Intercept beforeunload: Only show loader for actual page navigations
      window.addEventListener('beforeunload', function() {
          if (window.isDownloadingFile || window.__isHandlingExternalIntent || window.__isLightboxOpen) {
              window.isDownloadingFile = false;
              return;
          }
          triggerLoader();
      });

      // Intercept any link click
      document.addEventListener('click', function(e) {
          const link = e.target.closest('a');
          if (link) {
              const href = link.getAttribute('href');
              
              if (isExternalOrSpecialAction(link, href)) {
                  // Mark as handling external intent to prevent beforeunload trap
                  window.__isHandlingExternalIntent = true;
                  setTimeout(() => {
                      window.__isHandlingExternalIntent = false;
                      window.hideMasterLoader();
                  }, 2500);
                  return; // DO NOT show loader!
              }

              if (!e.defaultPrevented) {
                  triggerLoader();
              }
          }
      }, true);

      document.addEventListener('submit', function(e) {
          const form = e.target.closest('form');
          if (form && form.getAttribute('target') === '_blank') return;
          if (!e.defaultPrevented) {
              triggerLoader();
          }
      });


      // ----------------------------------------------------------------------
      // 2. GLOBAL MEDIA LIGHTBOX ENGINE (SEAMLESS IN-PAGE PREVIEWS)
      // ----------------------------------------------------------------------
      const lbOverlay = document.getElementById('abcd-global-lightbox');
      const lbTitle = document.getElementById('abcd-lb-title');
      const lbBadge = document.getElementById('abcd-lb-badge');
      const lbImg = document.getElementById('abcd-lb-img');
      const lbSpinner = document.getElementById('abcd-lb-spinner');
      const lbViewport = document.getElementById('abcd-lb-viewport');
      const lbCloseBtn = document.getElementById('abcd-lb-close');
      const lbZoomInBtn = document.getElementById('abcd-lb-zoom-in');
      const lbZoomOutBtn = document.getElementById('abcd-lb-zoom-out');
      const lbDownloadBtn = document.getElementById('abcd-lb-download');
      const lbPrevBtn = document.getElementById('abcd-lb-prev');
      const lbNextBtn = document.getElementById('abcd-lb-next');
      const lbDots = document.getElementById('abcd-lb-dots');

      let currentGallery = [];
      let currentGalleryIndex = 0;
      let currentZoom = 1;
      let isPanning = false;
      let startPanX = 0, startPanY = 0;
      let currentPanX = 0, currentPanY = 0;
      let touchStartDist = 0;

      function updateImageTransform() {
          if (!lbImg) return;
          lbImg.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentZoom})`;
      }

      function resetZoomAndPan() {
          currentZoom = 1;
          currentPanX = 0;
          currentPanY = 0;
          updateImageTransform();
          if (lbViewport) lbViewport.classList.remove('grabbing');
      }

      function renderLightboxImage(item) {
          if (!item || !lbImg) return;
          lbSpinner.style.display = 'block';
          lbImg.style.opacity = '0.2';
          resetZoomAndPan();

          const tempImg = new Image();
          tempImg.src = item.url;
          tempImg.onload = function() {
              lbImg.src = item.url;
              lbSpinner.style.display = 'none';
              lbImg.style.opacity = '1';
          };
          tempImg.onerror = function() {
              lbSpinner.style.display = 'none';
              lbImg.src = item.url; // fallback direct
              lbImg.style.opacity = '1';
          };

          // Title & Badge
          const title = item.title || `Image ${currentGalleryIndex + 1} of ${currentGallery.length}`;
          if (lbTitle) lbTitle.textContent = title;
          if (lbBadge) {
              if (currentGallery.length > 1) {
                  lbBadge.textContent = `${currentGalleryIndex + 1}/${currentGallery.length}`;
              } else {
                  lbBadge.textContent = item.badge || 'PHOTO';
              }
          }

          // Nav Buttons
          if (currentGallery.length > 1) {
              if (lbPrevBtn) lbPrevBtn.style.display = 'flex';
              if (lbNextBtn) lbNextBtn.style.display = 'flex';
          } else {
              if (lbPrevBtn) lbPrevBtn.style.display = 'none';
              if (lbNextBtn) lbNextBtn.style.display = 'none';
          }

          // Render Dots
          if (lbDots) {
              lbDots.innerHTML = '';
              if (currentGallery.length > 1 && currentGallery.length <= 8) {
                  currentGallery.forEach((_, idx) => {
                      const dot = document.createElement('div');
                      dot.className = `abcd-lb-dot ${idx === currentGalleryIndex ? 'active' : ''}`;
                      dot.onclick = () => {
                          currentGalleryIndex = idx;
                          renderLightboxImage(currentGallery[currentGalleryIndex]);
                      };
                      lbDots.appendChild(dot);
                  });
                  lbDots.style.display = 'flex';
              } else {
                  lbDots.style.display = 'none';
              }
          }
      }

      window.ABCDMediaLightbox = {
          open: function(options) {
              if (!lbOverlay) return;
              window.__isLightboxOpen = true;
              window.isDownloadingFile = false;
              window.__isHandlingExternalIntent = false;

              if (Array.isArray(options.gallery) && options.gallery.length > 0) {
                  currentGallery = options.gallery;
                  currentGalleryIndex = options.index >= 0 ? options.index : 0;
              } else {
                  currentGallery = [{
                      url: options.url,
                      title: options.title || 'Image Preview',
                      badge: options.badge || 'PHOTO'
                  }];
                  currentGalleryIndex = 0;
              }

              renderLightboxImage(currentGallery[currentGalleryIndex]);

              lbOverlay.classList.add('active');
              lbOverlay.setAttribute('aria-hidden', 'false');
              document.body.style.overflow = 'hidden'; // prevent scrolling behind
          },

          close: function() {
              if (!lbOverlay) return;
              lbOverlay.classList.remove('active');
              lbOverlay.setAttribute('aria-hidden', 'true');
              document.body.style.overflow = '';
              setTimeout(() => {
                  if (lbImg) lbImg.src = '';
                  window.__isLightboxOpen = false;
              }, 200);
          },

          next: function() {
              if (currentGallery.length <= 1) return;
              currentGalleryIndex = (currentGalleryIndex + 1) % currentGallery.length;
              renderLightboxImage(currentGallery[currentGalleryIndex]);
          },

          prev: function() {
              if (currentGallery.length <= 1) return;
              currentGalleryIndex = (currentGalleryIndex - 1 + currentGallery.length) % currentGallery.length;
              renderLightboxImage(currentGallery[currentGalleryIndex]);
          },

          zoomIn: function() {
              currentZoom = Math.min(currentZoom + 0.35, 3.5);
              updateImageTransform();
          },

          zoomOut: function() {
              currentZoom = Math.max(currentZoom - 0.35, 0.7);
              if (currentZoom <= 1) {
                  currentPanX = 0;
                  currentPanY = 0;
              }
              updateImageTransform();
          },

          downloadCurrent: async function() {
              const item = currentGallery[currentGalleryIndex];
              if (!item || !item.url) return;
              
              window.isDownloadingFile = true;
              const fileName = (item.title || 'downloaded-image').replace(/[^a-zA-Z0-9_-]/g, '_') + '.jpg';

              try {
                  const res = await fetch(item.url, { mode: 'cors' });
                  const blob = await res.blob();
                  const blobUrl = window.URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = blobUrl;
                  a.download = fileName;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  setTimeout(() => window.URL.revokeObjectURL(blobUrl), 1000);
              } catch (err) {
                  // Fallback direct safe download
                  const a = document.createElement('a');
                  a.href = item.url;
                  a.target = '_blank';
                  a.download = fileName;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
              } finally {
                  setTimeout(() => { window.isDownloadingFile = false; }, 2000);
              }
          }
      };

      // Shorthand Global Function
      window.openMediaPreview = function(url, title = 'Photo Preview') {
          window.ABCDMediaLightbox.open({ url, title });
      };

      // Wire Up Lightbox Controls
      if (lbCloseBtn) lbCloseBtn.addEventListener('click', () => window.ABCDMediaLightbox.close());
      if (lbNextBtn) lbNextBtn.addEventListener('click', () => window.ABCDMediaLightbox.next());
      if (lbPrevBtn) lbPrevBtn.addEventListener('click', () => window.ABCDMediaLightbox.prev());
      if (lbZoomInBtn) lbZoomInBtn.addEventListener('click', () => window.ABCDMediaLightbox.zoomIn());
      if (lbZoomOutBtn) lbZoomOutBtn.addEventListener('click', () => window.ABCDMediaLightbox.zoomOut());
      if (lbDownloadBtn) lbDownloadBtn.addEventListener('click', () => window.ABCDMediaLightbox.downloadCurrent());

      // Close on Backdrop Click
      if (lbOverlay) {
          lbOverlay.addEventListener('click', function(e) {
              if (e.target === lbOverlay || e.target === document.getElementById('abcd-lb-body') || e.target === lbViewport) {
                  window.ABCDMediaLightbox.close();
              }
          });
      }

      // Keyboard navigation (Esc to close, Arrow keys to navigate)
      document.addEventListener('keydown', function(e) {
          if (!window.__isLightboxOpen) return;
          if (e.key === 'Escape') {
              window.ABCDMediaLightbox.close();
          } else if (e.key === 'ArrowRight') {
              window.ABCDMediaLightbox.next();
          } else if (e.key === 'ArrowLeft') {
              window.ABCDMediaLightbox.prev();
          } else if (e.key === '+' || e.key === '=') {
              window.ABCDMediaLightbox.zoomIn();
          } else if (e.key === '-') {
              window.ABCDMediaLightbox.zoomOut();
          }
      });

      // Mouse Wheel Zoom
      if (lbViewport) {
          lbViewport.addEventListener('wheel', function(e) {
              if (!window.__isLightboxOpen) return;
              e.preventDefault();
              if (e.deltaY < 0) {
                  window.ABCDMediaLightbox.zoomIn();
              } else {
                  window.ABCDMediaLightbox.zoomOut();
              }
          }, { passive: false });

          // Mouse Drag Pan
          lbViewport.addEventListener('mousedown', function(e) {
              if (currentZoom <= 1) return;
              isPanning = true;
              startPanX = e.clientX - currentPanX;
              startPanY = e.clientY - currentPanY;
              lbViewport.classList.add('grabbing');
          });

          window.addEventListener('mousemove', function(e) {
              if (!isPanning) return;
              currentPanX = e.clientX - startPanX;
              currentPanY = e.clientY - startPanY;
              updateImageTransform();
          });

          window.addEventListener('mouseup', function() {
              if (isPanning) {
                  isPanning = false;
                  if (lbViewport) lbViewport.classList.remove('grabbing');
              }
          });

          // Touch Drag & Pinch-to-zoom for Mobile
          lbViewport.addEventListener('touchstart', function(e) {
              if (e.touches.length === 1 && currentZoom > 1) {
                  isPanning = true;
                  startPanX = e.touches[0].clientX - currentPanX;
                  startPanY = e.touches[0].clientY - currentPanY;
              } else if (e.touches.length === 2) {
                  touchStartDist = Math.hypot(
                      e.touches[0].clientX - e.touches[1].clientX,
                      e.touches[0].clientY - e.touches[1].clientY
                  );
              }
          }, { passive: true });

          lbViewport.addEventListener('touchmove', function(e) {
              if (e.touches.length === 1 && isPanning && currentZoom > 1) {
                  currentPanX = e.touches[0].clientX - startPanX;
                  currentPanY = e.touches[0].clientY - startPanY;
                  updateImageTransform();
              } else if (e.touches.length === 2 && touchStartDist > 0) {
                  const dist = Math.hypot(
                      e.touches[0].clientX - e.touches[1].clientX,
                      e.touches[0].clientY - e.touches[1].clientY
                  );
                  const scaleFactor = dist / touchStartDist;
                  currentZoom = Math.min(Math.max(currentZoom * scaleFactor, 0.8), 3.5);
                  touchStartDist = dist;
                  updateImageTransform();
              }
          }, { passive: true });

          lbViewport.addEventListener('touchend', function(e) {
              if (e.touches.length === 0) {
                  isPanning = false;
                  touchStartDist = 0;
              }
          });

          // Double Tap to Zoom / Reset on Mobile
          let lastTap = 0;
          lbViewport.addEventListener('touchend', function(e) {
              const currentTime = new Date().getTime();
              const tapLength = currentTime - lastTap;
              if (tapLength < 300 && tapLength > 0) {
                  e.preventDefault();
                  if (currentZoom > 1) {
                      resetZoomAndPan();
                  } else {
                      currentZoom = 2;
                      updateImageTransform();
                  }
              }
              lastTap = currentTime;
          });
      }

      // ----------------------------------------------------------------------
      // 3. AUTOMATIC DELEGATED CLICK BINDING FOR COMPLAINTS & MEDIA LINKS
      // ----------------------------------------------------------------------
      document.addEventListener('click', function(e) {
          // Check for image links or complaint thumbnails
          const link = e.target.closest('.complaint-thumb-link, .complaint-img-link, [data-preview-media], .preview-attachments a, .history-attachments-grid a');
          if (link) {
              const href = link.getAttribute('href') || link.getAttribute('data-preview-url');
              if (href && !href.startsWith('javascript:')) {
                  e.preventDefault();
                  e.stopPropagation();

                  // Find gallery siblings if present in same container
                  const parentGroup = link.closest('.complaint-thumbs, .images-grid, .history-attachments-grid, .preview-attachments');
                  let gallery = [];
                  let initialIndex = 0;

                  if (parentGroup) {
                      const allLinks = Array.from(parentGroup.querySelectorAll('.complaint-thumb-link, .complaint-img-link, [data-preview-media], a'));
                      gallery = allLinks.map((l, i) => {
                          const url = l.getAttribute('href') || l.getAttribute('data-preview-url');
                          const title = l.getAttribute('title') || l.getAttribute('aria-label') || (l.querySelector('img') ? l.querySelector('img').getAttribute('alt') : `Photo ${i + 1}`);
                          return { url, title, badge: 'COMPLAINT' };
                      }).filter(item => item.url && item.url !== '#');

                      initialIndex = allLinks.indexOf(link);
                      if (initialIndex < 0) initialIndex = 0;
                  }

                  if (gallery.length === 0) {
                      const title = link.getAttribute('title') || (link.querySelector('img') ? link.querySelector('img').getAttribute('alt') : 'Photo Preview');
                      gallery = [{ url: href, title, badge: 'PHOTO' }];
                      initialIndex = 0;
                  }

                  window.ABCDMediaLightbox.open({
                      gallery: gallery,
                      index: initialIndex
                  });
                  return;
              }
          }

          // Also check direct click on images with zoom class or complaint-thumb class
          const img = e.target.closest('img.complaint-thumb, img.complaint-img, img.preview-media-img');
          if (img && !img.closest('a')) {
              e.preventDefault();
              e.stopPropagation();
              window.ABCDMediaLightbox.open({
                  url: img.src,
                  title: img.alt || 'Photo Preview',
                  badge: 'PHOTO'
              });
          }
      }, true);

  })();
</script>
