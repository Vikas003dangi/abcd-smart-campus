<style>
    .fp-overlay {
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: var(--z-modal-overlay);
        display: none;
        align-items: center;
        justify-content: center;
        animation: fpFadeIn 0.25s ease;
    }
    .fp-overlay.fp-active { display: flex; }
    @keyframes fpFadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
    .fp-card {
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 20px 60px rgba(102, 126, 234, 0.25), 0 8px 24px rgba(0,0,0,0.15);
        width: min(420px, 92vw);
        overflow: hidden;
        animation: fpSlideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        color: #1e293b;
    }
    @keyframes fpSlideUp {
        from { opacity: 0; transform: translateY(30px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    .fp-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 22px 24px 18px;
        color: #fff;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
    }
    .fp-header-left { display: flex; align-items: center; }
    .fp-header-icon {
        width: 40px; height: 40px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.2rem;
        flex-shrink: 0;
        margin-right: 12px;
    }
    .fp-header h3 { margin: 0 0 3px; font-size: 1.15rem; font-weight: 700; }
    .fp-header p { margin: 0; font-size: 0.8rem; opacity: 0.85; }
    .fp-close {
        background: rgba(255,255,255,0.15);
        border: none; color: #fff;
        width: 30px; height: 30px;
        border-radius: 50%;
        font-size: 1rem;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        transition: background 0.2s;
    }
    .fp-close:hover { background: rgba(255,255,255,0.3); }
    .fp-steps {
        display: flex; align-items: center; justify-content: center; gap: 0; padding: 16px 24px 0;
    }
    .fp-step-dot {
        width: 28px; height: 28px;
        border-radius: 50%;
        border: 2px solid #ddd;
        background: #f5f5f5;
        color: #bbb;
        font-size: 0.75rem;
        font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    .fp-step-dot.done {
        background: linear-gradient(135deg, #667eea, #764ba2);
        border-color: transparent;
        color: #fff;
    }
    .fp-step-dot.active {
        background: #fff;
        border-color: #667eea;
        color: #667eea;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }
    .fp-step-line { flex: 1; height: 2px; background: #ddd; max-width: 50px; }
    .fp-step-line.done { background: linear-gradient(90deg, #667eea, #764ba2); }
    .fp-body { padding: 20px 24px 24px; }
    .fp-desc { font-size: 0.88rem; color: #555; margin: 0 0 16px; line-height: 1.5; }
    .fp-field { position: relative; margin-bottom: 14px; }
    .fp-field label { display: block; font-size: 0.78rem; font-weight: 600; color: #526D82; margin-bottom: 5px; text-transform: uppercase; }
    .fp-field input {
        width: 100%; padding: 11px 42px 11px 14px; border: 1.5px solid #dde3ea; border-radius: 9px;
        font-size: 0.92rem; color: #112a3b; background: #f8fafc; outline: none; transition: all 0.25s;
    }
    .fp-field input:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    .fp-otp-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
    .fp-otp-box {
        width: 42px; height: 48px; border: 1.5px solid #dde3ea; border-radius: 9px;
        font-size: 1.4rem; font-weight: 700; text-align: center; color: #112a3b; background: #f8fafc;
        outline: none; transition: all 0.2s;
    }
    .fp-otp-box:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
    .fp-otp-hint { font-size: 0.78rem; color: #888; text-align: center; margin-bottom: 14px; }
    .fp-resend-link { font-size: 0.8rem; text-align: center; color: #667eea; cursor: pointer; text-decoration: underline; }
    .fp-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .fp-btn { padding: 10px 22px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .fp-btn-secondary { background: #f0f0f0; color: #555; }
    .fp-btn-secondary:hover { background: #e0e0e0; }
    .fp-btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; box-shadow: 0 4px 14px rgba(102,126,234,0.4); }
    .fp-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(102,126,234,0.5); }
    .fp-btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .fp-msg { display: none; padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; margin-bottom: 15px; }
    .fp-msg.fp-err { display: block; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .fp-msg.fp-ok { display: block; background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    
    /* Dark Theme */
    body.dark-theme .fp-card { background: #1e293b; color: #f8fafc; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid #334155; }
    body.dark-theme .fp-desc { color: #94a3b8; }
    body.dark-theme .fp-otp-box,
    body.dark-theme .fp-field input { background: #0f172a; border-color: #334155; color: #f8fafc; }
    body.dark-theme .fp-otp-box:focus,
    body.dark-theme .fp-field input:focus { border-color: #6366f1; background: #0f172a; }
    body.dark-theme .fp-btn-secondary { background: #334155; color: #f8fafc; }
    body.dark-theme .fp-btn-secondary:hover { background: #475569; }
</style>

<!-- Step 1: Verify OTP -->
<div id="authOtpModal" class="fp-overlay">
    <div class="fp-card">
        <div class="fp-header">
            <div class="fp-header-left">
                <div class="fp-header-icon">📩</div>
                <div class="fp-header-text">
                    <h3>Verify OTP</h3>
                    <p>Enter the 6-digit code sent to your email</p>
                </div>
            </div>
            <button class="fp-close" onclick="closeAuthResetFlow()">✕</button>
        </div>
        <div class="fp-steps">
            <div class="fp-step-dot done">✓</div>
            <div class="fp-step-line done"></div>
            <div class="fp-step-dot active">2</div>
            <div class="fp-step-line"></div>
            <div class="fp-step-dot">3</div>
        </div>
        <div class="fp-body">
            <p class="fp-desc">We sent a verification code to your email. It is valid for 5 minutes.</p>
            <div id="authOtpMsg" class="fp-msg"></div>
            <div class="fp-otp-row">
                <input class="auth-otp-box fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="text" onkeyup="authOtpFocusNext(this, event)">
                <input class="auth-otp-box fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="text" onkeyup="authOtpFocusNext(this, event)">
                <input class="auth-otp-box fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="text" onkeyup="authOtpFocusNext(this, event)">
                <input class="auth-otp-box fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="text" onkeyup="authOtpFocusNext(this, event)">
                <input class="auth-otp-box fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="text" onkeyup="authOtpFocusNext(this, event)">
                <input class="auth-otp-box fp-otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]" type="text" onkeyup="authOtpFocusNext(this, event)">
            </div>
            <p class="fp-otp-hint">Didn't get it? <button type="button" class="fp-resend-btn" id="auth_resend_link" onclick="authResendOtp(this)" style="background: none; border: none; color: #667eea; cursor: pointer; text-decoration: underline; font-size: 0.8rem; font-family: inherit; font-weight: inherit; padding: 0;">Resend OTP</button></p>
            <div class="fp-actions">
                <button type="button" class="fp-btn fp-btn-secondary" onclick="closeAuthResetFlow()">Cancel</button>
                <button type="button" class="fp-btn fp-btn-primary" onclick="authVerifyOtp()">Verify &rarr;</button>
            </div>
        </div>
    </div>
</div>

<!-- Step 2: Reset Password -->
<div id="authResetModal" class="fp-overlay">
    <div class="fp-card">
        <div class="fp-header">
            <div class="fp-header-left">
                <div class="fp-header-icon">🔑</div>
                <div class="fp-header-text">
                    <h3>New Password</h3>
                    <p>Set a strong new password</p>
                </div>
            </div>
            <button class="fp-close" onclick="closeAuthResetFlow()">✕</button>
        </div>
        <div class="fp-steps">
            <div class="fp-step-dot done">✓</div>
            <div class="fp-step-line done"></div>
            <div class="fp-step-dot done">✓</div>
            <div class="fp-step-line done"></div>
            <div class="fp-step-dot active">3</div>
        </div>
        <div class="fp-body">
            <p class="fp-desc">Your OTP has been verified ✅ &nbsp;Please type a new password below.</p>
            <div id="authResetMsg" class="fp-msg"></div>
            <div class="fp-field">
                <label for="auth_new_pass">New Password</label>
                <input type="password" id="auth_new_pass" placeholder="Min 8 characters" autocomplete="new-password">
            </div>
            <div class="fp-field" style="margin-top:12px;">
                <label for="auth_confirm_pass">Confirm New Password</label>
                <input type="password" id="auth_confirm_pass" placeholder="Re-enter password" autocomplete="new-password">
            </div>
            <div class="fp-actions">
                <button type="button" class="fp-btn fp-btn-secondary" onclick="closeAuthResetFlow()">Cancel</button>
                <button type="button" class="fp-btn fp-btn-primary" onclick="authResetPassword()">Reset Password ✓</button>
            </div>
        </div>
    </div>
</div>

<script>
    let authUserEmail = "{{ request.user.email|default:'' }}";
    function getTargetAuthEmail() {
        if (authUserEmail) return authUserEmail;
        if (window.__activeResetEmail) return window.__activeResetEmail;
        const emailInput = document.getElementById('forgot_email') || document.getElementById('email');
        return emailInput ? emailInput.value : '';
    }

    function showAuthOtpModal() {
        // Clear inputs and messages
        document.querySelectorAll('.auth-otp-box').forEach(el => el.value = '');
        hideAuthMsg('authOtpMsg');
        document.getElementById('authOtpModal').classList.add('fp-active');
        
        syncAuthResendStatus();

        setTimeout(() => {
            const firstBox = document.querySelector('.auth-otp-box');
            if (firstBox) firstBox.focus();
        }, 300);
    }

    function showAuthResetModal() {
        document.getElementById('auth_new_pass').value = '';
        document.getElementById('auth_confirm_pass').value = '';
        hideAuthMsg('authResetMsg');
        document.getElementById('authOtpModal').classList.remove('fp-active');
        document.getElementById('authResetModal').classList.add('fp-active');
    }

    function closeAuthResetFlow() {
        document.getElementById('authOtpModal').classList.remove('fp-active');
        document.getElementById('authResetModal').classList.remove('fp-active');
    }

    function showAuthMsg(id, msg, type) {
        const el = document.getElementById(id);
        if (el) {
            el.className = 'fp-msg ' + (type === 'error' ? 'fp-err' : 'fp-ok');
            el.textContent = msg;
            el.style.display = 'block';
        }
    }

    function hideAuthMsg(id) {
        const el = document.getElementById(id);
        if (el) {
            el.style.display = 'none';
        }
    }

    function authOtpFocusNext(input, e) {
        const boxes = document.querySelectorAll('.auth-otp-box');
        const idx = Array.from(boxes).indexOf(input);
        const val = input.value;

        if (e.key === 'Backspace' || e.key === 'ArrowLeft') {
            if (idx > 0) {
                boxes[idx - 1].focus();
            }
        } else if (val.length === 1 || e.key === 'ArrowRight') {
            if (idx < boxes.length - 1) {
                boxes[idx + 1].focus();
            }
        }
    }

    let authResendInterval = null;

    function updateAuthResendUI(element, attempt_count, seconds) {
        if (!element) return;
        
        if (authResendInterval) {
            clearInterval(authResendInterval);
        }

        if (seconds > 0) {
            element.style.pointerEvents = 'none';
            element.style.opacity = '0.5';
            element.disabled = true;
            
            let secondsLeft = seconds;
            element.textContent = `Resend OTP (${attempt_count} of 3) in ${secondsLeft}s`;
            
            authResendInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) {
                    clearInterval(authResendInterval);
                    if (attempt_count >= 3) {
                        element.textContent = `Resend OTP (3 of 3 attempts used)`;
                        element.style.pointerEvents = 'none';
                        element.style.opacity = '0.5';
                        element.disabled = true;
                    } else {
                        element.textContent = `Resend OTP`;
                        element.style.pointerEvents = '';
                        element.style.opacity = '';
                        element.disabled = false;
                    }
                } else {
                    element.textContent = `Resend OTP (${attempt_count} of 3) in ${secondsLeft}s`;
                }
            }, 1000);
        } else {
            if (attempt_count >= 3) {
                element.textContent = `Resend OTP (3 of 3 attempts used)`;
                element.style.pointerEvents = 'none';
                element.style.opacity = '0.5';
                element.disabled = true;
            } else {
                element.textContent = `Resend OTP`;
                element.style.pointerEvents = '';
                element.style.opacity = '';
                element.disabled = false;
            }
        }
    }

    async function syncAuthResendStatus() {
        const element = document.getElementById('auth_resend_link');
        if (!element) return;
        try {
            const response = await fetch("{% url 'users:otp_status' %}");
            if (response.ok) {
                const data = await response.json();
                updateAuthResendUI(element, data.attempts, data.cooldown_seconds);
            }
        } catch (e) {
            console.error("Error syncing OTP status:", e);
        }
    }

    // Call sync on page load to restore state on refresh
    window.addEventListener('DOMContentLoaded', () => {
        syncAuthResendStatus();
    });

    async function authResendOtp(element) {
        if (!element) return;
        element.style.pointerEvents = 'none';
        element.style.opacity = '0.5';
        element.textContent = 'Sending…';

        const formData = new FormData();
        formData.append("email", getTargetAuthEmail());
        try {
            const response = await fetch("{% url 'users:forgot_password' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            });
            const data = await response.json();
            if (response.status === 429) {
                if (window.showStyledAlert) {
                    await window.showStyledAlert("Rate Limit Exceeded", data.message || "Please try again later.", "warning");
                } else {
                    await CustomPopup.alert(data.message || "Please try again later.", "Rate Limit Exceeded");
                }
                await syncAuthResendStatus();
            } else if (response.ok) {
                showAuthMsg('authOtpMsg', "OTP resent successfully!", 'success');
                updateAuthResendUI(element, data.attempts, data.cooldown_seconds);
            } else {
                element.textContent = 'Resend OTP';
                element.style.pointerEvents = '';
                element.style.opacity = '';
                showAuthMsg('authOtpMsg', data.message || "Failed to resend OTP.", 'error');
            }
        } catch (err) {
            console.error(err);
            element.textContent = 'Resend OTP';
            element.style.pointerEvents = '';
            element.style.opacity = '';
            showAuthMsg('authOtpMsg', "Network error. Please try again.", 'error');
        }
    }

    async function authVerifyOtp() {
        const boxes = document.querySelectorAll('.auth-otp-box');
        let otp = "";
        boxes.forEach(b => otp += b.value.trim());

        if (otp.length < 6) {
            showAuthMsg('authOtpMsg', "Please enter all 6 digits of the OTP.", 'error');
            return;
        }

        const formData = new FormData();
        formData.append("email", getTargetAuthEmail());
        formData.append("otp", otp);

        try {
            const response = await fetch("{% url 'users:verify_otp' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            });
            const data = await response.json();
            if (response.ok && data.status === 'ok') {
                showAuthResetModal();
            } else {
                showAuthMsg('authOtpMsg', data.message || "Invalid OTP code.", 'error');
            }
        } catch (err) {
            console.error(err);
            showAuthMsg('authOtpMsg', "Network error. Please try again.", 'error');
        }
    }

    async function authResetPassword() {
        const newPass = document.getElementById('auth_new_pass').value;
        const confirmPass = document.getElementById('auth_confirm_pass').value;

        if (!newPass || !confirmPass) {
            showAuthMsg('authResetMsg', "Please fill in all fields.", 'error');
            return;
        }

        const formData = new FormData();
        formData.append("new_password", newPass);
        formData.append("confirm_password", confirmPass);

        try {
            const response = await fetch("{% url 'users:reset_password' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                }
            });
            const data = await response.json();
            if (response.ok && data.status === 'ok') {
                closeAuthResetFlow();
                if (window.showStyledAlert) {
                    await window.showStyledAlert("Success", "Your password has been successfully reset!", "success");
                } else {
                    await CustomPopup.alert("Your password has been successfully reset!", "Success");
                }
                window.location.reload();
            } else {
                showAuthMsg('authResetMsg', data.message || "Failed to reset password.", 'error');
            }
        } catch (err) {
            console.error(err);
            showAuthMsg('authResetMsg', "Network error. Please try again.", 'error');
        }
    }
</script>
