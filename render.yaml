services:
  - type: web
    name: abcd-web-platform
    env: python
    rootDir: abcd_web
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput; python manage.py createcachetable; python manage.py init_production; daphne -b 0.0.0.0 -p $PORT abcd_web.asgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        value: "https://abcd2013.online"
      - key: ALLOWED_HOSTS
        value: "abcd2013.online,www.abcd2013.online,abcdcampus.in,www.abcdcampus.in,.onrender.com,abcd-web-platform.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://abcd2013.online,https://www.abcd2013.online,https://abcdcampus.in,https://www.abcdcampus.in,https://abcd-web-platform.onrender.com"
      # Google OAuth (public client ID safe in yaml; secret must be set in Render dashboard)
      - key: SOCIAL_AUTH_GOOGLE_OAUTH2_KEY
        value: "729497897582-ln9h8cai5ighe13pf624goue4mmp2b1u.apps.googleusercontent.com"
      # YouTube (public channel ID safe in yaml; API key must be set in Render dashboard)
      - key: YOUTUBE_CHANNEL_ID
        value: "UCA2H6hQBD3h4Oi2vhnWWi5Q"
      # Permanent PostgreSQL Database (Neon)
      - key: DATABASE_URL
        sync: false
      # ---------------------------------------------------------------
      # SECRETS BELOW: These are declared here so render.yaml documents
      # every key the app needs, but their VALUES must be set manually
      # in Render Dashboard > Environment. render.yaml values are only
      # used on first deploy; after that, dashboard values take priority.
      # ---------------------------------------------------------------
      - key: SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: VAKU_PASSWORD
        sync: false
      - key: SANDY_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Cloudinary Cloud Storage (Permanent 25GB Media)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
