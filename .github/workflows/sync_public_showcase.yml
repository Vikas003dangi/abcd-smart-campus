name: Sync Public Recruiter Showcase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-showcase:
    name: Sanitize & Sync to Public Showcase Repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Core Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Sanitized Showcase Payload
        run: |
          echo "=== 1. Creating Isolated Showcase Staging Directory ==="
          mkdir -p /tmp/showcase_payload

          echo "=== 2. Copying Public Documentation & Assets ==="
          cp README.md /tmp/showcase_payload/
          cp LICENSE /tmp/showcase_payload/
          cp .env.example /tmp/showcase_payload/

          mkdir -p /tmp/showcase_payload/docs/play_store_assets
          cp -r docs/play_store_assets/* /tmp/showcase_payload/docs/play_store_assets/
          
          if [ -f docs/FEE_SERVICE_WORKFLOW.md ]; then
            cp docs/FEE_SERVICE_WORKFLOW.md /tmp/showcase_payload/docs/
          fi
          if [ -f docs/twa_playstore_guide.md ]; then
            cp docs/twa_playstore_guide.md /tmp/showcase_payload/docs/
          fi

          mkdir -p /tmp/showcase_payload/architecture
          cat << 'EOF' > /tmp/showcase_payload/architecture/SYSTEM_SPECIFICATION.md
          # 🏛️ ABCD Campus — Architectural Specification & Interface Contracts

          This repository serves as the public engineering showcase for the **ABCD Campus** Enterprise Educational ERP & Smart Library Platform.
          The production backend and proprietary business engines are securely hosted on private infrastructure powering [abcdcampus.in](https://abcdcampus.in).

          ## Architectural Topology
          - **Ingress / Edge**: Daphne ASGI Gateway running Twisted Async Event Loop.
          - **Real-Time Layer**: Django Channels 4.3 WebSockets multiplexed over Channel Layers.
          - **Primary Persistence**: Neon Serverless PostgreSQL with atomic transaction isolation.
          - **Media Storage**: Cloudinary Cloud Storage with automated orphan reapers.
          - **Mobile Delivery**: Native Android Trusted Web Activity (TWA) targeting Android API 36.
          EOF

          echo "=== 3. Running Automated Security Whitelist Audit ==="
          # Fail immediately if any secret, credential, database, or proprietary engine leaked
          LEAKS=$(find /tmp/showcase_payload -type f \( \
            -name ".env*" -o \
            -name "*.pyc" -o \
            -name "*.sqlite3*" -o \
            -name "*.jks" -o \
            -name "*.keystore" -o \
            -name "*views.py" -o \
            -name "*settings.py" -o \
            -name "*notifications.py" -o \
            -name "keystore.properties" \
          \))

          if [ -n "$LEAKS" ]; then
            echo "CRITICAL SECURITY BREACH: Forbidden files detected in payload!"
            echo "$LEAKS"
            exit 1
          fi
          echo "Security audit passed: Payload is 100% clean and sanitized."

      - name: Deploy Payload to Public Showcase Repository
        env:
          SHOWCASE_PAT: ${{ secrets.SHOWCASE_SYNC_PAT }}
        run: |
          if [ -z "$SHOWCASE_PAT" ]; then
            echo "::error::Secret SHOWCASE_SYNC_PAT is not set. Add a GitHub PAT with repo scope in Settings -> Secrets."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Cloning Target Showcase Repository ==="
          git clone "https://x-access-token:${SHOWCASE_PAT}@github.com/Vikas003dangi/abcd-campus-showcase.git" /tmp/showcase_repo
          cd /tmp/showcase_repo

          echo "=== Syncing Clean Payload via Rsync ==="
          # Use rsync to preserve existing git metadata while updating all files
          rsync -av --delete --exclude='.git' /tmp/showcase_payload/ /tmp/showcase_repo/

          git add -A
          if git diff --cached --quiet; then
            echo "Zero changes detected. Showcase repository is already up to date."
          else
            git commit -m "chore: automated sync from core engineering repository [skip ci]"
            git push origin main
            echo "Showcase repository successfully updated."
          fi
